l_english:
 USA_focus:0 "USA National Focus"
 AAW_USA_office_of_strategic_services:0 "Office of Strategic Services"
 AAW_USA_office_of_strategic_services_desc:0 "Forming a dedicated intelligence agency will not only aid the war, but future operations abroad. British intelligence services can serve as a model."
 AAW_USA_wartime_industry:0 "Wartime Industry"
 AAW_USA_wartime_industry_desc:0 "We have a strong industry, but not all of it is well adapted for production of war materials. Finding efficient processes to facilitate this change will be key to utilizing our resources."
 AAW_USA_first_special_service_force:0 "First Special Service Force"
 AAW_USA_first_special_service_force_desc:0 "Operations behind enemy lines in inhospitable territory will be part of any global conflict. Forming commando units to fulfill these roles is essential to our future warfare."
 AAW_USA_rubber_reserve_company:0 "Rubber Reserve Company"
 AAW_USA_rubber_reserve_company_desc:0 "With the eruption of war, we have lost almost all our sources of imported rubber.\n\nWith an enormous coordinated effort, the rubber companies in the United States can cooperate to find better means of producing synthetic rubber, possibly even meeting the demands of the war effort."
 AAW_USA_manifest_destiny:0 "Manifest Destiny"
 AAW_USA_manifest_destiny_desc:0 "The special circumstances around our nation's foundation and history give us mandate to act on injustice and oppression anywhere in the world. To create a safe international community, our primary export must be freedom."
 AAW_USA_manifest_destiny_tt:0 "§YGives wargoals against all Fascist and Communist nations.§!\n"
 AAW_USA_scientist_haven:0 "Research and Analysis Branch"
 AAW_USA_scientist_haven_desc:0 "Having asserted ourselves as guardians of the world, we can welcome researchers and intellectuals driven out of the regimes abroad, giving them a chance to succeed and aid our cause in the land of opportunity."
 AAW_USA_wpa:0 "Expand Works Progress Administration"
 AAW_USA_wpa_desc:0 "Millions of people are still suffering the unemployment resulting from the Great Depression. An agency to put these people to work on public projects may not fully solve the problem, but the Work Progress Administration is a step in the right direction."
 AAW_USA_committee_on_technocracy:0 "Committee on Technocracy"
 AAW_USA_committee_on_technocracy_desc:0 "We should replace a number of politicians and businesspeople with scientists and engineers. They have the technical expertise to manage the economy and we will see great scientific progress, which will lead to our economy flourishing once again."
 AAW_USA_support_rock_island:0 "Support Rock Island Arsenal"
 AAW_USA_support_rock_island_desc:0 "Supporting our brave troops in any way we can is key to victory. Be that by laying down heavy artillery fire from a distance or more direct support on the battlefield. We must make sure our troops have everything they need."
 AAW_USA_military_construction:0 "Military Construction"
 AAW_USA_military_construction_desc:0 "With superpowers threatening world peace, our public works projects need to be turned towards military matters as well as civilian ones."
 AAW_USA_USACE_projects:0 "USACE Projects"
 AAW_USA_USACE_projects_desc:0 "The U.S. Army Corps of Engineers will be put to the task of building the foundation for many future military projects the like of which the world has never seen. Essayons!"
 AAW_USA_arsenal_of_democracy:0 "Arsenal of Democracy"
 AAW_USA_arsenal_of_democracy_desc:0 "Regardless of whether or not we choose to intervene directly in a war, democratic nations must know that we will arm and support them."
 AAW_USA_liberty_ships:0 "Liberty Ships"
 AAW_USA_liberty_ships_desc:0 "Mass-production of cargo ships need to accompany our industrial developments to ensure our materials and troops reach the theaters where they are needed."
 AAW_USA_war_propaganda:0 "War Propaganda"
 AAW_USA_war_propaganda_desc:0 "Our people don't want to send their children to die in another war, but many politicians see a need for intervention. Propaganda to demonize the enemy and call for open conflict may not only be a tool for tyrants."
 AAW_USA_war_plan_black:0 "War Plan Black"
 AAW_USA_war_plan_black_desc:0 "It's plain to see that Germany's politics and expansionism goes far beyond any measure of sanity. They must be stopped before their war machine reaches the point of no return."
 AAW_USA_embargo_germany:0 "Embargo Germany"
 AAW_USA_embargo_germany_desc:0 "Germany is dependent on oil and other natural resources for their war effort. Cutting off their access to these is the least we can do."
 AAW_USA_destroyers_for_bases:0 "Destroyers For Bases Deal"
 AAW_USA_destroyers_for_bases_desc:0 "The UK is in need of ships, and we need to protect our home territory. For the right to set up military bases in currently British territories, we can exchange some Destroyers, which will hopefully be put to good use as well."
 AAW_USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 AAW_USA_war_plan_white:0 "War Plan White"
 AAW_USA_war_plan_white_desc:1 "The [GetSovietThreatName] Menace cannot be allowed to expand unchecked. Whether from without or from within, there is no greater threat to our nation and the world at large."
 AAW_USA_embargo_USSR:0 "Embargo USSR"
 AAW_USA_embargo_USSR_desc:0 "Depriving the Soviet Union of trade opportunities with us will both keep us from aiding their military efforts and prove our economic model as superior."
 AAW_USA_war_plan_red:0 "War Plan Red"
 AAW_USA_war_plan_red_desc:0 "After appearing to be on the path to respecting the people, our old oppressors are now at odds with the winds of change we've accepted. The British Empire is showing its true colors. We must let them know where we stand."
 AAW_USA_embargo_the_empire:0 "Embargo The Empire"
 AAW_USA_embargo_the_empire_desc:0 "Despite having enjoyed good relations for a long time, the British have betrayed the ideals we hoped they learned to live up to. It's time to let them know the consequences."
 AAW_USA_war_plan_orange:0 "War Plan Orange"
 AAW_USA_war_plan_orange_desc:0 "There is no greater threat to us than Japan's imperialistic ambitions. Their efforts to expand into Asia and the Pacific will put them at odds with our interests quickly."
 AAW_USA_embargo_japan:0 "Embargo Japan"
 AAW_USA_embargo_japan_desc:0 "We must show Japan that their aggression will not be accepted or aided by the USA. An embargo will be the first step to thwarting their designs on the Pacific."
 AAW_USA_prepare_intervention:0 "Prepare Intervention"
 AAW_USA_prepare_intervention_desc:0 "Through diplomatic and trade decisions, our position on the international scene has shifted from neutral and isolationist to taking a stance on foreign aggressions. Our military policies will reflect this in in the future."
 AAW_USA_extra_tech_team:0 "Extra Tech Team"
 AAW_USA_manhattan_project:0 "Manhattan Project"
 AAW_USA_manhattan_project_desc:0 "Development of Substitute Materials, an innocent-sounding USACE project, will eventually be known as the Manhattan Project. One of the most secretive and dangerous undertakings in military history, its goal is to create the first atomic bomb."
 AAW_USA_unholy_alliance:0 "Alliance with the Soviets"
 AAW_USA_unholy_alliance_desc:0 "Sometimes, we have to choose our enemies. Often, the choice is not easy. The future may judge us for standing side by side with one tyrant, or praise us for saving it from the other."
 AAW_USA_unholy_alliance_tt:1 "Boosts opinion and trade opinion with [SOV.GetNameDef] or Germany if they are at war, siding with the defender."
 AAW_USA_limited_intervention:0 "Limited Intervention"
 AAW_USA_limited_intervention_desc:0 "It would take extraordinary aggression to draw us into a war at full force, but after recent developments, many people are freely willing to assist in conflicts abroad."
 AAW_USA_the_giant_wakes:0 "The Giant Wakes"
 AAW_USA_the_giant_wakes_desc:0 "Nations turn to us to protect the values of democracy and liberty. The world where non-interventionist America was born no longer exists and we must adapt accordingly."
 AAW_USA_pearl_harbor_gambit:0 "Pearl Harbor Gambit"
 AAW_USA_pearl_harbor_gambit_desc:0 "The naval base in Pearl Harbor is an easy target for the Japanese. By basing a fleet there, we will demonstrate our power in the Pacific. Will they dare challenge such a bold move?"
 AAW_USA_pearl_harbor_gambit_tt:0 "§YWhile the focus is running, Japan will have the opportunity to launch an attack.§!"
 AAW_USA_cancel_pearl_harbor_gambit:0 "Cancel Pearl Harbor Gambit"
 AAW_USA_cancel_pearl_harbor_gambit_desc:0 "Stationing a fleet in Pearl Harbor endangers the lives of our sailors. We will not risk them to provoke a war with Japan."
 AAW_USA_air_war_plans_division:0 "Air War Plans Division"
 AAW_USA_air_war_plans_division_desc:0 "To make the right priorities in aviation as well as aircraft production will require long-term planning. The AWPD will ensure we have materiel, organization and strategic plans."
 AAW_USA_air_support:0 "Battlefield Support Plan"
 AAW_USA_air_support_desc:0 "Aerial warfare must first and foremost be used in conjunction with other military operations."
 AAW_USA_strategic_bombing:0 "Strategic Bombing Plan"
 AAW_USA_strategic_bombing_desc:0 "The capacity to execute precision bombing will allow us to stop the war machine of any nation in its tracks."
 AAW_USA_TAC:0 "Tactical Bomber Research"
 AAW_USA_TAC_desc:0 "Constructing planes built to attack tactical targets will make way for our troops to advance more safely."
 AAW_USA_combined_bomber_offensive:0 "Combined Bomber Offensive"
 AAW_USA_combined_bomber_offensive_desc:0 "With another Great Power on our side, we have unexpected advantages in researching and applying large-scale offensive bombing."
 AAW_USA_fund_the_navy:0 "Fund The Navy"
 AAW_USA_fund_the_navy_desc:0 "We must be able to adapt to anything new our enemies throws at us. Increased funding to navy exercises will lead to a more efficient navy that can tactically outperform our enemies."
 AAW_USA_bureau_of_ships:0 "Bureau of Ships"
 AAW_USA_bureau_of_ships_desc:1 "We will combine the Bureau of Construction and Repair and the Bureau of Engineering into one entity to oversee future naval developments. While we're at it, it may be time to investigate rumors of inefficient torpedo performance which the Bureau of Ordnance so vehemently deny."
 AAW_USA_battleship_primacy:0 "Battleship Primacy"
 AAW_USA_battleship_primacy_desc:0 "With the Japanese denounciation of the Washington Naval Treaty, we may face another arms race on the oceans. We will ensure we have both the most and best battleships."
 AAW_USA_advanced_mahanian_doctrine:0 "Advanced Mahanian Doctrine"
 AAW_USA_advanced_mahanian_doctrine_desc:0 "The influence of Alfred Thayer Mahan on naval warfare can hardly be underestimated. Building on his work will allow us to make good use of battleships, which he considered a decisive factor."
 AAW_USA_carrier_primacy:0 "Carrier Primacy"
 AAW_USA_carrier_primacy_desc:0 "Air power will be needed in battles to come, and the most practical means of extending its range is the use of aircraft carriers. We must create more advanced and specialized models."
 AAW_USA_bureau_of_aeronautics:0 "Bureau of Aeronautics"
 AAW_USA_bureau_of_aeronautics_desc:0 "To meet the needs for naval aviation development, the Bureau of Aeronautics, which has been responsible for these matters for decades, will have to be expanded."
 AAW_USA_escort_effort:0 "ASW Effort"
 AAW_USA_escort_effort_desc:0 "Submarines constitute a danger to our merchant convoys. Focusing on development of new destroyer models will allow us to wage anti-submarine warfare efficiently."
 AAW_USA_convoy_tactics:0 "Convoy Tactics"
 AAW_USA_convoy_tactics_desc:0 "Protecting our trade vessels is not just about escorts and effective intelligence, but also tactical choices in how to arrange our trade routes and routines."
 AAW_USA_amphibious_operations:0 "Amphibious Operations"
 AAW_USA_amphibious_operations_desc:0 "Unless our worst nightmares come true, this war will not be ended on American soil. Well-executed landings will need to be part of the path to victory."
 AAW_USA_expand_the_USMC:0 "Expand the USMC"
 AAW_USA_expand_the_USMC_desc:0 "The United States Marine Corps have been a decisive force in many past wars and may be more relevant than ever for our amphibious campaigns. Semper fidelis!"
 AAW_USA_reinforce_monroe_doctrine:0 "Reaffirm Monroe Doctrine"
 AAW_USA_reinforce_monroe_doctrine_desc:0 "Dating over a 100 years back, the Monroe Doctrine codified US intervention in the case of European attempts to colonize the Americas, but stay out of European affairs. Strengthening our role as peace-keepers on these continents will improve our influence in the region."
 AAW_USA_carribean_sphere:0 "Caribbean Sphere"
 AAW_USA_carribean_sphere_desc:0 "The Caribbean islands offer the perfect location to launch strikes against our Eastern coast or the Panama canal, so of course we must make it clear that no hostile takeovers of the area will be permitted."
 AAW_USA_central_america:0 "Central America"
 AAW_USA_central_america_desc:0 "It would be unthinkable to let any foreign power take control of, or even be able to threaten, the Panama canal. As such, we shall guarantee the independence of all the Central American nations."
 AAW_USA_the_neighbors:0 "The Neighbors"
 AAW_USA_the_neighbors_desc:0 "We must first and foremost see to the safety of the countries closest to us. Rather than having the enemy cross our neighbors to get to us, they'll cross us if they cross our neighbors."
 AAW_USA_south_america:0 "South America"
 AAW_USA_south_america_desc:0 "Colonial empires must never again be able to expand into South America, we shall guarantee the independence of our Southern brothers to keep them safe."
 AAW_USA_pax_americana:0 "Pax Americana"
 AAW_USA_pax_americana_desc:0 "The peace in America must be kept. We have the strength to ensure that petty squabbles between neighboring nation do not escalate. A war at our doorsteps is exactly what our enemies want, and we must do everything we can to prevent it."
 AAW_USA_pax_americana_tt:0 "@USA §YUnited States§! can intervene in wars between American countries"
 AAW_USA_black_chamber:0 "Black Chamber Operations"
 AAW_USA_black_chamber_complete:0 "§RCLASSIFIED§!"
 AAW_USA_black_chamber_desc:0 "We have information of political activities in a number of American countries that does not align with our interests. Fortunately we have established a underground propaganda network and are ready to push these countries in our direction. This is something we must do to ensure that we are not under threat at home."
 AAW_USA_preemptive_intervention:0 "Preemptive Intervention"
 AAW_USA_preemptive_intervention_desc:0 "We can no longer sit idly by and watch neighboring countries build tool of war meant to suppress us or our allies. We must intervene for the greater good of our mighty country and the world."
 AAW_USA_reinforce_monroe_doctrine_tt:0 "Increases Trade Opinion with all American nations.\n"
 AAW_USA_civil_war_fired:0 "The Second American Civil War has started."
 AAW_USA_anti_imperialism:0 "Anti-Imperialism"
 AAW_USA_anti_imperialism_desc:0 "America has always been an enemy of imperialistic oppressors, but it's plain to see that most so-called democracies are willing to keep these institutions alive as long as they benefit from them. The revolutionaries of the Soviet Union are better allies."
 AAW_USA_fascist_menace:1 "The Prussian Menace"
 AAW_USA_fascist_menace_desc:1 "The Versailles Treaty and economic sanctions haven't stopped Germany, and Prussian militarism is once again rearing its ugly, aggressive head. Germany must be defeated again and brought under our control, at least for the time being."
 AAW_USA_crusade_against_communism:0 "Crusade Against Communism"
 AAW_USA_crusade_against_communism_desc:0 "The Red Terror is by far the worst menace this world has ever faced. By any means necessary, the destructive ideology emanating from the Soviet Union must be cut off at its origin, and we will be the ones to do it."
 AAW_USA_strike_at_the_empire:0 "Strike at the Empire"
 AAW_USA_strike_at_the_empire_desc:0 "The true threat to liberty in the world is the colonial empires built by European superpowers. They must be crushed and their populations freed, starting with the British Empire we once freed ourselves from."
 AAW_USA_defense_of_the_pacific:0 "Defense of the Pacific"
 AAW_USA_defense_of_the_pacific_desc:0 "The Japanese government is beyond hope, its expansionism threatening both our people and its Asian neighbors. The nation must be brought under American administration to reform it and prevent it from ever repeating its mistakes."
 AAW_USA_continue_the_new_deal:1 "Continue the New Deal"
 AAW_USA_continue_the_new_deal_desc:1 "The policies of the New Deal have proven to work. We must not lose our way now."
 AAW_USA_suspend_the_presecution:0 "Suspend the Persecution"
 AAW_USA_suspend_the_presecution_desc:0 "The persecution of American citizens for their political views - no matter how abhorrent they may seem - is fundamentally at odds with the values of this country. It must cease immediately."
 AAW_USA_desegregate_the_armed_forces:1 "Desegregate the Armed Forces"
 AAW_USA_desegregate_the_armed_forces_desc:1 "Serving under arms in the armed forces of one's country can be an unwelcome duty - but it can also be a cherished right. A right that many of our citizens are denied on account of their ancestry."
 AAW_USA_full_desegregation:1 "Full Desegregation"
 AAW_USA_full_desegregation_desc:1 "For too long, some of our states have treated people differently based on old, outdated and inhuman criteria. In a free republic, every citizen must be treated equally - and not seperately."
 AAW_USA_democratic_socialism:1 "Democratic Socialism"
 AAW_USA_democratic_socialism_desc:1 "No right-thinking person can deny that socialism is the future of human civilization. At the same time, no proud and patriotic citizen of this republic could possibly support a system where government is no longer made by the people and of the people. Like our proud forefathers, we will create a new form of government that combines both."
 AAW_USA_liberty_for_the_philippines:1 "Liberty for the Philippines"
 AAW_USA_liberty_for_the_philippines_desc:1 "The people of the Philippines have shown their ability to organize their own affairs, and it is about time that the last vestiges of American control over their country are official removed."
 AAW_USA_pacific_decolonisation:1 "Pacific Decolonisation"
 AAW_USA_pacific_decolonisation_desc:1 "There is no justification - none - for the continued presence of European powers in the Pacific, nor for keeping the peoples of the Pacific Islands in servitude to their European masters. America will no longer stand idly by while this injustice continues."
 AAW_USA_union_representation_act:1 "Union Representation Act"
 AAW_USA_union_representation_act_desc:1 "Work is a core part of human life, and organizing into a union is a fundamental part of organizing a democratic society. It is only proper that we should recognize this and ensure that unions have mandatory representation in Congress."
 AAW_USA_old_age_pension_act:1 "Old Age Pension Act"
 AAW_USA_old_age_pension_act_desc:1 "After a lifetime of work, our people deserve to enjoy financial security and respect in old age. What legislation exists to support them is clearly insufficient."
 AAW_USA_accumulated_wealth_tax_act:1 "Accumulated Wealth Tax Act"
 AAW_USA_accumulated_wealth_tax_act_desc:1 "Some people in our country have amassed absurd amounts of capital. This money sits passively in bank accounts or invested in impractically large buildings, gildened furniture and expensive paintings. None of these serve any viable economic purpose. by instituting a new tax we will force those amongst our citizens who have amassed such useless wealth to reinvest the money into the economy."
 AAW_USA_guarantee_the_american_dream:1 "Guarantee the American Dream"
 AAW_USA_guarantee_the_american_dream_desc:0 "Most of our people don't wish for much in life: stable employment, good health, and a place to start a family. There is no reason why they shouldn't have that."
 AAW_USA_worker_management_act:1 "Worker Management Act"
 AAW_USA_worker_management_act_desc:1 "Far too often factories and offices are managed by people who have never worked on the shop floor. Unable to understand the realities of production, they set unrealistic expectations. To safeguard our economy from the damage such incompetent managers can cause, we will enforce management of the workers, by the workers, for the workers!"
 AAW_USA_militia_organization_act:1 "Militia Organization Act"
 AAW_USA_militia_organization_act_desc:1 "Our proud republic has a long tradition of the citizen soldier. Should our country ever find itself invaded by a foreign attacker, they will face a well-organized and well-armed militia of men and women fighting on familiar territory to defend their homes."
 AAW_USA_communal_property_act:1 "Communal Property Act"
 AAW_USA_communal_property_act_desc:1 "The needs of the many should never be outweighed by the desires of the few, or even the one. To ensure that this is the case, we will pass new legislation to allow local communities to execute eminent domain more easily."
 AAW_USA_reintegration:1 "Reintegration"
 AAW_USA_reintegration_desc:1 "The war has divided our nation, but eventually, even those that rose up against us can yet be redeemed. When the population has learned the error of their ways, they should be allowed to once again rejoin the political process in our proud republic."
 AAW_USA_reach_out_to_the_ware_group:1 "Reach out to the Ware Group"
 AAW_USA_reach_out_to_the_ware_group_desc:1 "There exists a small group of devoted communists inside our government. They believe that they operate in secret, but we know their names. Perhaps they could see that our goal align and could be persuaded to join the government."
 AAW_USA_us_ussr_economic_cooperation:1 "US-USSR Economic Cooperation"
 AAW_USA_us_ussr_economic_cooperation_desc:1 "Despite its chaotic and bloody birth, the Soviet Union has achieved remarkable progress in building a modern, industrialized society. We should do our part to help them."
 AAW_USA_secure_china:1 "Secure China"
 AAW_USA_secure_china_desc:1 "China has been gripped by a long, bloody civil war. The Nationalist government is deeply corrupt and has lost all support in the population. It is time we start to support the single actor in China who can unite and pacify the country - the Communist Party."
 AAW_USA_end_monarchism:1 "End Monarchism"
 AAW_USA_end_monarchism_desc:1 "The monarchies of Europe have plunged the world into one world war already - we can not allow them to do it again. Our forefathers made war on the King of England to gain their freedom - we shall free the world from his tyranny forever!"
 AAW_USA_shatter_the_empires:1 "Shatter the Empires"
 AAW_USA_shatter_the_empires_desc:1 "We were once a colony of a global empire, until we purchased our freedom in blood. Our republic can not truely feel secure until those that dream themselves masters of this world are contained."
 AAW_USA_agricultural_adjustment_act:1 "Agricultural Adjustment Act"
 AAW_USA_agricultural_adjustment_act_desc:1 "Our farmers have been particularly hard-hit by the depression. We must ensure that the people who produce our food are not driven out of business by an unchecked market."
 AAW_USA_fair_labour_standards_act:1 "Fair Labor Standards Act"
 AAW_USA_fair_labour_standards_act_desc:1 "With the first signs of a slow recovery taking place, it is time to ensure that the workers get to participate in it. We must ban exploitative practices such as unpaid overtime and introduce a liveable minimum wage."
 AAW_USA_federal_housing_act:1 "Federal Housing Act"
 AAW_USA_federal_housing_act_desc:1 "As part of our ongoing efforts to eradicate poverty in the United States, we will create a program of federally-subsidized housing."
 AAW_USA_office_of_scientific_research_and_development:1 "Scientific Research & Development Office"
 AAW_USA_office_of_scientific_research_and_development_desc:1 "With war looming on the horizon, we must focus our scientific efforts to ensure that we are not outmatched by any potential adversary."
 AAW_USA_focus_on_europe:1 "Preparation for Europe"
 AAW_USA_focus_on_europe_desc:1 "The Great Powers of Europe are once more poised to plunge the world into a world war. We can not, as we did before, wait until it affects us. We must be ready to intervene decisively should any nation in Europe threaten the peace."
 AAW_USA_focus_on_asia:1 "Preparation for Asia"
 AAW_USA_focus_on_asia_desc:1 "While most people look with worry towards Europe, we also face uncertainty and instability across the Pacific. It might be in our best interest to intervene abroad before we attacked closer to home."
 AAW_USA_magic:1 "MAGIC"
 AAW_USA_magic_desc:1 "The Navy thinks it can break the Japanese encryption codes, which would allow us to read all of their message traffic, including ship movements."
 AAW_USA_neutrality_act:1 "Neutrality Act"
 AAW_USA_neutrality_act_desc:1 "It seems increasingly certain that war will break out in Europe. During the Great War, American companies sold large quantites of weapons to the Allies, and many believe that the American entry was mostly motivated by a desire to ensure that those deliveries would be paid for. This time, there won't be any war-profiteering."
 AAW_USA_lend_lease_act_neutrality_tt:0 "\n\nPassing the Neutrality Act will §Rdrastically increase§! the requirements to pass the Lend Lease Act"
 AAW_USA_lend_lease_act:1 "Lend Lease Act"
 AAW_USA_lend_lease_act_desc:1 "The large democracies of the world are under assault. If they lose the battle, it is only a question of time before war comes to our shores. We must do what we can to support them - even if they can not pay for the equipment immediately."
 AAW_USA_reestablish_the_gold_standard:1 "Reestablish the Gold Standard"
 AAW_USA_reestablish_the_gold_standard_desc:1 "Without the Gold Standard, money exists as little more than an article of faith, while rampant inflation eats away our people's savings and devalues their work. We must abandon this fiscally irresponsible path."
 AAW_USA_adjusted_compensation_act:1 "Adjusted Compensation Act"
 AAW_USA_adjusted_compensation_act_desc:1 "Our veterans of the Great War were promised a fair pension. Many have fallen on hard times recently as the depression hit. We must do what we can to help those who answered the call of the Republic in its hour of need."
 AAW_USA_labour_management_relations_act:1 "Labor-Management Relations Act"
 AAW_USA_labour_management_relations_act_desc:1 "Businesses all over America are threatened by all kinds of union activities - strikes, organizing, demands for higher wages. We can not allow this to continue."
 AAW_USA_protectionist_tariffs:1 "Protectionist Tariffs"
 AAW_USA_protectionist_tariffs_desc:1 "Free Trade has opened up our markets to foreign competitors, many of which have raised tariffs and duties of their own. Our companies face stiff competition while theirs enjoy the safety of the customs-wall. This must end."
 AAW_USA_income_tax_reform:2 "Income Tax Reform"
 AAW_USA_income_tax_reform_desc:1 "The Income Tax takes money out of every American's wallet - money that our citizens could spend on buying other things and supporting their local economy. We will give Americans the autonomy over their own finances back."
 AAW_USA_institute_of_american_sciences:1 "American Institute of Sciences"
 AAW_USA_institute_of_american_sciences_desc:1 "The universities and research labs all across the nation have so far conducted their research as they saw fit. This must end. We will create a new organization to coordinate the efforts of our world-class scientists."
 AAW_USA_america_first:0 "America First"
 AAW_USA_america_first_desc:2 "Some people would have us spend our treasures and the blood of our youth in foreign wars. We must not be swayed by these warmongerers, and will instead live by a simple maxim: America First - Everyone Else Second."
 AAW_USA_extend_the_chinese_exclusion_acts:1 "Extend the Chinese Exclusion Acts"
 AAW_USA_extend_the_chinese_exclusion_acts_desc:2 "With China ravaged by war we must take steps to limit Chinese immigration, lest we be drowned in waves of refugees."
 AAW_USA_empower_the_huac:1 "Empower the HUAC"
 AAW_USA_empower_the_huac_desc:1 "The House Commitee on Unamerican Activities serves an important function in our healthy democracy. We must not permit disloyal elements from trying to influence the political process."
 AAW_USA_voter_registration_act:1 "Voter Registration Act"
 AAW_USA_voter_registration_act_desc:1 "Elections are the most important part of a democracy. It is utterly unreasonable to demand that there should be no checks on who can participate in them - or perhaps, the people who argue for uncontrolled elections have more sinister motivations and wish to subvert the process with vote fraud..."
 AAW_USA_ally_with_the_silver_shirts:1 "American Fascism"
 AAW_USA_ally_with_the_silver_shirts_desc:1 "To restore our nation to its proper place in the world and claim our manifest destiny, a more fundamental reorganization is necessary. The Silver Shirts will help us achieve this."
 AAW_USA_ally_with_the_silver_shirts_tt:1 "Pick the leader for the new America"
 AAW_USA_national_prosperity_program:1 "National Prosperity Program"
 AAW_USA_national_prosperity_program_desc:1 "The key to ensuring a swift recovery and lasting prosperity lies not in unchecked markets but in carefully guided programs, connecting private and public enterprises."
 AAW_USA_privatize_the_TVA:1 "Privatize the TVA"
 AAW_USA_privatize_the_TVA_desc:1 "The Tennessee Valley Authority has crowded out private competition and has established a stranglehold on construction work in the area. It can not be the government's job to do things the private sector has proven to do better."
 AAW_USA_de_regulate_the_banking_sector:1 "De-Regulate the Banking Sector"
 AAW_USA_de_regulate_the_banking_sector_desc:1 "Following a correction in the financial markets that is perfectly normal in the economic cycle, previous governments have instituted quite unreasonable constraints on financial activities. While no doubt well-intentioned, these restrictions clearly do more harm than good."
 AAW_USA_national_employment_strategy:1 "National Employment Strategy"
 AAW_USA_national_employment_strategy_desc:1 "Unemployment comes from a simple fact: people don't match up with the jobs offered. Factories lie idle because employers don't find the people they need while people in other parts of the country starve. We will introduce a new strategy that will ensure that any employer can find the people he needs to run his company."
 AAW_USA_invite_foreign_support:1 "Invite Foreign Support"
 AAW_USA_invite_foreign_support_desc:1 "With some very disturbing reports coming in about the loyalty of the military and some state governments, we might have to look abroad for support."
 AAW_USA_send_lindbergh_to_germany:1 "Send Lindbergh To Germany"
 AAW_USA_send_lindbergh_to_germany_desc:1 "The famous aviator has offered to go to Europe to investigate how Germany has rebuilt itself after the last war. This should give us valuable experience. Lindbergh has also indicated that he would be willing to join the government in a consulting role."
 AAW_USA_work_with_the_bund:1 "Work With the Bund"
 AAW_USA_work_with_the_bund_desc:1 "The German-American Bund has offered to help us communicate our positions to the many Americans of German ancestry. It would ensure that we have a sympathetic base in their states."
 AAW_USA_work_with_the_bund_tt:0 "Ensures that the following states remain with the government in the event of a civil war: Ohio, Missouri, Wisconsin, Illinois, Indiana and Michigan"
 AAW_USA_recruit_the_free_corps:1 "Formalize the Free Corps"
 AAW_USA_recruit_the_free_corps_desc:1 "The Free Corps is the paramilitary wing of our organization. Now that we're in power, we should make them a more formal organization within our government."
 AAW_USA_honor_the_confederacy:1 "Honor the Confederacy"
 AAW_USA_honor_the_confederacy_desc:1 "For too long, the story of the Civil War was told from the northern perspective - the story of a doomed rebellion. It is time that the other side is heard as well."
 AAW_USA_war_powers_act:1 "War Powers Act"
 AAW_USA_war_powers_act_desc:1 "In a world of increasingly fast aircraft carrying increasingly larger bombloads, in a world of submarines and chemical weapons, restricting the President to require the consent of Congress to do what is needed to defend the country is inviting disaster."
 AAW_USA_seize_cuba:1 "Seize Cuba"
 AAW_USA_seize_cuba_desc:1 "Just off our shores lies an unsinkable aircraft carrier, ready to serve as a base for an aggressor. We must not let that happen."
 AAW_USA_eliminate_the_southern_threat:1 "Eliminate the Southern Threat"
 AAW_USA_eliminate_the_southern_threat_desc:1 "Mexico has been an unstable mess for the last generation. Whether the violence spills over our border or someone unites the country and marches north is irrelevant - we must secure our southern flank."
 AAW_USA_the_canadian_corridor:1 "The Canadian Corridor"
 AAW_USA_the_canadian_corridor_desc:1 "A small strip of sparsely populated Canadian territory separates Alaska from the lower US. Its defense is therefore dependent on Canadian good-will. However, the most likely attacker is Canada. This can not continue."
 AAW_USA_north_american_dominion:1 "North American Dominion"
 AAW_USA_north_american_dominion_desc:1 "With our immediate borders secure, we must look further afield to preempt any threat against North America. We can not tolerate any rogue state in the region."
 AAW_USA_strategic_interests:1 "Strategic Interests"
 AAW_USA_strategic_interests_desc:1 "The world is more connected than ever before. A threat in one part of it can easily grow until it becomes a danger to the entire world. We must build a network of mutually-supporting bases around the globe to enable us to respond quickly to any situation."
 AAW_USA_protect_south_america:1 "Protect South America"
 AAW_USA_protect_south_america_desc:1 "The southern part of our double continent has been the playground of empires since it was discovered. It is time that someone took it upon themselves to ensure that those nations are undisturbed and guided towards a more productive future."
 AAW_USA_pacific_pacification:1 "Pacific Pacification"
 AAW_USA_pacific_pacification_desc:1 "Australia and New Zealand are too far from Britain to be effectively defended by them. We can not allow them to be taken over by a nation hostile to [USA.GetNameDef]."
 AAW_USA_secure_asia:1 "Secure Asia"
 AAW_USA_secure_asia_desc:1 "The colonial nations in Europe seem either unwilling or unable to effectively defend their Asian colonies. We must take over this burden for them, lest these areas become springboards of further aggression."
 AAW_USA_global_hegemony:1 "Global Hegemony"
 AAW_USA_global_hegemony_desc:1 "We stand at the cusp of achieving a position of global supremacy that will allow us to prevent conflict just through our mere existence. We just have to ensure that the remaining Great Powers on the planet acknowledge our position."
 AAW_USA_war_plans_division:1 "War Plans Division Overhaul"
 AAW_USA_war_plans_division_desc:1 "While we might desire peace, we must prepare for war. With lessons learned from the maneuvers in Louisiana, we should modernize the war plans originally drafted in the 1920s and 1930s."
 AAW_USA_intervention_in_the_americas:1 "Intervention in the Americas"
 AAW_USA_intervention_in_the_americas_desc:1 "Our first order of business must be to ensure we are prepared for any eventuality in our own hemisphere."
 AAW_USA_war_plan_green:1 "War Plan Green"
 AAW_USA_war_plan_green_desc:1 "With Mexico in a constant state of instability following the revolution, we must be prepared to intervene, decisively."
 AAW_USA_war_plan_crimson:1 "War Plan Crimson"
 AAW_USA_war_plan_crimson_desc:1 "While Canada may be a friendly neighbor now, this may not always be the case."
 AAW_USA_war_plan_gray:1 "War Plan Gray"
 AAW_USA_war_plan_gray_desc:1 "History has shown that the nations of the Caribbean are quite unstable. We might have to move quickly to protect American interests should any of them fall into instability."
 AAW_USA_hemisphere_defense:1 "Hemisphere Defense"
 AAW_USA_hemisphere_defense_desc:1 "Regardless of any foreign entanglements, we must first and foremost look to our own neighborhood."
 AAW_USA_intervention_in_europe:1 "Intervention in Europe"
 AAW_USA_intervention_in_europe_desc:1 "Less than two decades after the end of the Great War, the nations of Europe are once again poised for war. We must be prepared in case the situation requires swift intervention."
 AAW_USA_war_plan_gold:1 "War Plan Gold"
 AAW_USA_war_plan_gold_desc:1 "France suffers from internal division and increasing political radicalism, but is also one of the greatest military powers of Europe. This combination makes many people uncomfortable."
 AAW_USA_war_plan_silver:0 "War Plan Silver"
 AAW_USA_war_plan_silver_desc:0 "Italy has openly declared its ambition to rule the Mediterranean. If their desires of an Empire conflict with our interests, we must be prepared."
 AAW_USA_anti_bolshevist_aid:2 "Anti [GetSovietThreatNameAlt] Aid"
 AAW_USA_anti_bolshevist_aid_desc:2 "Any gun, shell, bullet and pair of boots we can give to those fighting the spread of the [GetSovietThreatNameAlt] Threat will ultimately help defend us."
 AAW_USA_war_plan_ruby:1 "War Plan Ruby"
 AAW_USA_war_plan_ruby_desc:1 "India houses untold millions of people, which we must be prepared to face should we come into conflict."
 AAW_USA_war_plan_scarlet_garnet:1 "War Plan Scarlet Garnet"
 AAW_USA_war_plan_scarlet_garnet_desc:1 "In the Pacific, Australia and New Zealand may well come to the aid of their motherland. Any plan to deal with Britain must account for her colonies."
 AAW_USA_intervention_in_asia:1 "Intervention In Asia"
 AAW_USA_intervention_in_asia_desc:1 "Often overshadowed by the developments in Europe, Asia has its own trouble spots, forcing us to prepare for an intervention."
 AAW_USA_war_plan_yellow:1 "War Plan Yellow"
 AAW_USA_war_plan_yellow_desc:1 "China has been in a state of civil war for more than a generation. There is no telling when the situation deteriorates to the point where we have to intervene."
 AAW_USA_war_department:1 "War Department Overhaul"
 AAW_USA_war_department_desc:1 "In an age of industrialized warfare, we must have an administration capable of harnessing the resources of our great nation to their fullest potential."
 AAW_USA_selective_training_act:1 "Selective Training Act"
 AAW_USA_selective_training_act_desc:1 "The United States has historically been slow to adopt a draft, even in times of war. We are no longer able to afford this luxury."
 AAW_USA_louisiana_maneuvers:1 "Louisiana Maneuvers"
 AAW_USA_louisiana_maneuvers_desc:1 "Budget constraints have forced us to observe many military developments from afar. Now, we can finally try out some of our theories in practice."
 AAW_USA_airborne_divisions:1 "Airborne Divisions"
 AAW_USA_airborne_divisions_desc:1 "The developments in the range and payload of planes have opened up a number of possibilities. Cargo planes could deliver a full division of troops far behind enemy lines, where they would wreak havoc."
 AAW_USA_armed_forces_of_the_united_states:1 "Army of the United States"
 AAW_USA_armed_forces_of_the_united_states_desc:1 "For the fights that are to come, the US military is too small. To oversee the dramatic increase in size we will have to accomplish, we will need to create a new organization."
 AAW_USA_womens_armed_service_integration_act:1 "Women's Armed Service Integration Act"
 AAW_USA_womens_armed_service_integration_act_desc:1 "We can not afford to turn away anyone who wishes to serve. Every woman in uniform frees up a man to fight at the front."
 AAW_USA_tank_experiments:1 "Tank Experiments"
 AAW_USA_tank_experiments_desc:1 "Tanks are indispensable on the modern battlefield. We must find out how to best utilize them."
 AAW_USA_tank_destroyer_doctrine:1 "Tank Destroyer Doctrine"
 AAW_USA_tank_destroyer_doctrine_desc:1 "A controversial theory developed by some artillery officers, claiming that the best weapon against armored breakthroughs is a fast, lightly armored but heavily armed vehicle."
 AAW_USA_main_battle_tanks:1 "Main Battle Tanks"
 AAW_USA_main_battle_tanks_desc:1 "Experience in the field has clearly shown that a tank must be able to perform a large number of tasks, from infantry support to fighting enemy tanks. Designing vehicles to meet these needs allows us to streamline production."
 AAW_USA_armored_infantry:1 "Armored Infantry"
 AAW_USA_armored_infantry_desc:1 "Tanks alone can not win a battle. It takes infantry to hold territory. Providing them with armored vehicles allows them to keep up with the tanks and survive anything thrown at them."
 AAW_USA_build_the_pentagon:1 "Build the Pentagon"
 AAW_USA_build_the_pentagon_desc:1 "The expansion of our military requires a new global headquarters to command it."
 AAW_USA_department_of_defense:1 "Department of Defense"
 AAW_USA_department_of_defense_desc:1 "Renaming the war department underlines that we can no longer choose to ignore our protection until the moment it is tested. We must always be vigilant."
 AAW_USA_escort_fighters:1 "Escort Fighters"
 AAW_USA_escort_fighters_desc:1 "While the bomber might always get through, his wingman might not - unless they are both protected by friendly fighters."
 AAW_USA_us_army_airforce:1 "U.S. Army Air Forces"
 AAW_USA_us_army_airforce_desc:1 "The fundamental objective of military airpower is to allow the ground forces to take and hold ground. Everything else is ancillary."
 AAW_USA_us_air_force:1 "U.S. Air Force"
 AAW_USA_us_air_force_desc:1 "The fundamental objective of military airpower is to win wars. Strategic bombing with ever more devastating weapons will either break the will of the enemy to resist or render them materially unable to do so."
 AAW_USA_two_ocean_navy_act:1 "Two Ocean Navy Act"
 AAW_USA_two_ocean_navy_act_desc:1 "With war on the horizon, we must ensure that no enemy can ever set foot on American shores. Our navy must be able to fight any enemy in either of the two great oceans that form our borders."
 AAW_USA_maritime_commission:1 "Maritime Commission"
 AAW_USA_maritime_commission_desc:1 "While most laymen only focus on the warships, the true experts know that it is the humble cargo vessel that wins wars. To increase the amount of shipping available in times of war, we will form a special board to coordinate construction."
 AAW_USA_advanced_basing:1 "Advanced Basing"
 AAW_USA_advanced_basing_desc:1 "The further we can keep the enemy from our shores, the better."
 AAW_USA_naval_radar:1 "Naval Radar"
 AAW_USA_naval_radar_desc:1 "Radar offers tantalizing possibilities to take the cover of night away from our enemies and detect them even in bad weather."
 AAW_USA_fleet_submarines:1 "Fleet Submarines"
 AAW_USA_fleet_submarines_desc:1 "Our most likely opponents in the naval war both rely on foreign trade, which has shown to be very vulnerable to submarines. These submarines would have to have very long range to allow them to cross the oceans and operate close to the enemy shore."
 AAW_USA_unrestricted_submarine_warfare:1 "Unrestricted Submarine Warfare"
 AAW_USA_unrestricted_submarine_warfare_desc:1 "History has shown that whatever well-intentioned treaty tried to control submarine warfare is not worth the paper it is written on. We should not consider ourselves bound by something our enemies will ignore anyway."
 AAW_USA_great_depression_cooldown:0 "New Legislation is still being drafted"
 AAW_USA_limited_intervention_tt:0 "\n\nPassing this law will make it §Rsignificantly harder§! to mobilize your economy.\n\n"
 AAW_USA_CAS:0 "CAS Research"
 AAW_USA_CAS_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
 AAW_USA_army_reform:0 "Army Reform"
 AAW_USA_army_reform_desc:0 "The United States Army tactical doctrine hasn't changed much since the end of the Grear War while the rest of the worlds' militaries have evolved. We should devote resources to modernizing our land forces way of thinking."
 AAW_USA_air_reform:0 "Air Reform"
 AAW_USA_air_reform_desc:0 "American military aviation relied heavily on French and British equipment and doctrine during the Great War. While we no longer rely on their equipment, our practices haven't evolved adequately enough. Time for this to change!"
 AAW_USA_navy_reform:0 "Navy Reform" 
 AAW_USA_navy_reform_desc:0 "The United States Navy has been the forerunner of American military might for decades. From the Great White Fleet to the dreadnoughts of the Great War, we've been on the forefront of naval evolution in the 20th century. With another war possible, we should analyze our current methodologies to remain a world leader in naval warfare." 
 AAW_USA_artillery_focus:0 "Superior Firepower Plan"
 AAW_USA_artillery_focus_desc:0 "The Great War proved artillery to be a vital asset on the battlefield. One option for reform is to analyze the tactics used and improve upon them for modern warfare."
 AAW_USA_mechanised_focus:0 "Mechanized Warfare Plan"
 AAW_USA_mechanised_focus_desc:0 "The Battle of Cambrai in World War I changed combat forever. With highly mobile, armored forces breakthroughs can be made to push the enemy back and encircle them."
 AAW_USA_planning_focus:0 "Quartermaster Plan"
 AAW_USA_planning_focus_desc:0 "Napoleon once said an army marches on its stomach. Without adequate supply lines, our armies can never be effective. We should study effective supply organization and planning to make our armies as efficient and deadly as possible."
 AAW_USA_lessons_from_the_great_war:0 "Lessons from the Great War"
 AAW_USA_lessons_from_the_great_war_desc:0 "Studying the tactics of Georg Bruchmüller and the Canadian Expeditionary Forces during World War I would be a great first step in modernizing our artillery program."
 AAW_USA_artillery_field_exercises:0 "Artillery Field Exercises"
 AAW_USA_artillery_field_exercises_desc:0 "Implementing brand new tactics can only be done partly through study and theoretical thinking. We should test out our new tactics using live fire drills and evaluate the results."
 AAW_USA_flexible_support:0 "Flexible Support"
 AAW_USA_flexible_support_desc:0 "Although we may have dedicated artillery units assigned to our divisions, we should allow them to support other nearby units as needed to maximize our offensive and defensive capabilities."
 AAW_USA_unrelenting_barrage:0 "Unrelenting Barrage"
 AAW_USA_unrelenting_barrage_desc:0 "There's no better way to demoralize and rout an enemy than by placing them under non-stop artillery fire. We should perfect our ability to do so."
 AAW_USA_mountain_warfare:0 "Mountain Warfare Experiments"
 AAW_USA_mountain_warfare_desc:0 "Several countries have utilized alpine troops of some sort in previous wars. Charles Minot Dole of the National Ski Patrol has been lobbying the War Department for a unit of this type. We should experiment in the mountains of Washington and develop mountain units of our own."
 AAW_USA_patton_reform:0 "Implement Patton Reform"
 AAW_USA_patton_reform_desc:0 "George Patton has been hounding Army brass for an opportunity to implement armor tactics. We should finally listen and let him implement his program of reform."
 AAW_USA_louisiana_maneuvers_phase_one:0 "Louisiana Maneuvers Phase I"
 AAW_USA_louisiana_maneuvers_phase_one_desc:0 "Our army hasn't been engaged in conflict since guns fell silent on the final day of World War I. We should organize an expansive war games for our generals to test their skills against one another using modern tactics. The bajous of Louisiana would be a perfect place to test skill in both terrain and manuever warfare."
 AAW_USA_louisiana_maneuvers_phase_two:0 "Louisiana Maneuvers Phase II"
 AAW_USA_louisiana_maneuvers_phase_two_desc:0 "Phase I proved to be an effective test for our leaders. Let's arrange another round for these leaders to test different tactics and learn from the mistakes of the first phase."
 AAW_USA_army_modernization:0 "Army Modernization" 
 AAW_USA_army_modernization_desc:0 "Army equipment is woefully outdated. Most units still have equipment from the Great War. We should immediately implement changes to modernize if we're to survive another war." 
 AAW_USA_logistics_board:0 "Defense Logistics Board"
 AAW_USA_logistics_board_desc:0 "With the sheer amount of supplies and coordination necessary for fielding an army, we should organize a group of both army and civilian professionals to oversee the operation of our logistics network."
 AAW_USA_tactics_review_board:0 "Tactics Review Board"
 AAW_USA_tactics_review_board_desc:0 "Our tactics haven't changed much in the two decades since the treaty of Versailles. We should arrange for several of our experienced generals to come together and review what our doctrine is and how we can improve."
 AAW_USA_expand_rotc:0 "Expand Reserve Officers' Training Corps"
 AAW_USA_expand_rotc_desc:0 "We've been training young officers at colleges and universities across the United States for a long time. This program should be expanded to all levels of academia to ensure we get the best of the best from our future generations of military leaders."
 AAW_USA_standardize_command_structure:0 "Standardize Command Structure"
 AAW_USA_standardize_command_structure_desc:0 "Our current command structure is a mess. Some units use flexible tactics while others are rigid in nature. We should develop a doctrine that is easier to understand for our officers in the field."
 AAW_USA_expand_war_colleges:0 "Expand War Colleges"
 AAW_USA_expand_war_colleges_desc:0 "The Army War College has been around since 1901. There's been a noticable absence of something similar for our air and naval components. We should work on providing these branch of services their own so our leaders there can also grow."
 AAW_USA_joint_chiefs_of_staff:0 "Joint Chiefs of Staff"
 AAW_USA_joint_chiefs_of_staff_desc:0 "The Allied High Command in World War I showed both the benefits and flaws of having a central general staff that dictates military strategy. We should use this same methodology within our own War Department."
 AAW_USA_airbase_expansion_east:0 "Eastern Airbase Expansion"
 AAW_USA_airbase_expansion_east_desc:0 "Our current support structure for the air component of our forces is insufficient. We should expand bases in crucial areas of the country to support the future growth of our air power."
 AAW_USA_airbase_expansion_west:0 "Western Airbase Expansion"
 AAW_USA_airbase_expansion_west_desc:0 "Our current support structure for the air component of our forces is insufficient. We should expand bases in crucial areas of the country to support the future growth of our air power."
 AAW_USA_dive_bombing_trials:0 "Dive Bombing Trials"
 AAW_USA_dive_bombing_trials_desc:0 "Some air generals believe dropping bombs while diving from a high altitude is a more accurate way to cause unit destruction. We should test this out and start utilizing it to better support our ground troops."
 AAW_USA_fighter:0 "Fighter Research"
 AAW_USA_fighter_desc:0 "Our fighters are incredibly outdated. What worked during the 1920s and 1930s certainly doesn't work now. All-steel airframes are becoming more common. We should create a brand new platform so our fighter squadrons are able to maintain air superiority."
 AAW_USA_carrier_lessons:0 "Lessons from the Fleet"
 AAW_USA_carrier_lessons_desc:0 "Naval aviation may still be a relatively new field of study, but we already have promising results from our pilots at sea. We should bring them back stateside and implement recommendations to airplane design."
 AAW_USA_heavy_bomber_research:0 "Heavy Bomber Research"
 AAW_USA_heavy_bomber_research_desc:0 "The idea of decimating enemy factories to knock a country out of a war has been talked about in recent years. To accomplish this, we need an airplane designed specifically with this idea in mind."
 AAW_USA_flying_fortress:0 "Flying Fortress"
 AAW_USA_flying_fortress_desc:0 "If we're to destroy enemy factories, our planes need to actually arrive at their targets. Enemy fighters and anti-aircraft fire are likely to intercept them on the way. If we specialize in making our airplanes as strong as possible defensively, we can ensure most of our planes receive their destination."
 AAW_USA_floating_fortress_concept:0 "Floating Fortress Concept"
 AAW_USA_floating_fortress_concept_desc:0 "Battleships represent the strong core of our fleets. We should make sure their crews perform as expected and to this high standard."
 AAW_USA_submarine_primacy:0 "Submarine Primacy"
 AAW_USA_submarine_primacy_desc:0 "How can a nation fight a war if they don't have the supply to do so? Focusing on trade interdiction with our submarine fleet will ensure we rule the waves below in the silent deep."
 AAW_USA_light_cruiser_development:0 "Light Cruiser Development"
 AAW_USA_light_cruiser_development_desc:0 "Tests have shown light cruisers are great platforms for taking out naval-based aircraft and escort ships. We should improve our designs to stay at the forefront of naval power projection."
 AAW_USA_heavy_cruiser_development:0 "Heavy Cruiser Development"
 AAW_USA_heavy_cruiser_development_desc:0 "Heavy cruisers are great ships for leading patrol groups or accompanying large task forces. We should develop new classes to ensure we don't lag behind the other naval powers of the world."
 AAW_USA_naval_aviation_schools:0 "Naval Aviation Schools"
 AAW_USA_naval_aviation_schools_desc:0 "The emergence of ship-based aircraft means our naval pilots need special training. We should establish schools to teach naval bombing and dogfighting tactics to this new generation of pilot. Do you feel the need... the need for speed?"
 AAW_USA_carrier_task_force_training:0 "Carrier Task Force Training"
 AAW_USA_carrier_task_force_training_desc:0 "Carriers becoming the focal point of our navy means we need to redevelop our way of thinking. We must protect these floating airfields with a fleet of ships that prevent breakthroughs to the center of our task forces where carriers lay."
 AAW_USA_modern_carrier_tactics:0 "Modern Carrier Tactics"
 AAW_USA_modern_carrier_tactics_desc:0 "With our pilots and ships being trained in the modern way of naval warfare, we can begin to develop tactics even further."
 AAW_USA_modernize_the_silent_service:0 "Modernize the Silent Service"
 AAW_USA_modernize_the_silent_service_desc:0 "Torpedos and submarines have advanced since Germany ran their campaign of unrestricted submarine warfare in the Great War. SONAR and anti-submarine warfare has advanced significantly in the past 20 years as well. We should develop tactics to ensure our submarines last against this."
 AAW_USA_finish_hoover_dam:0 "Finish the Hoover Dam"
 AAW_USA_finish_hoover_dam_desc:0 "The Hoover Dam has been under construction for over five years. With one final injection of resources and manpower, we can finally finish this project that will greatly help the tri-state area."
 AAW_USA_infrastructure_expansion:0 "Infrastructure Expansion Plan"
 AAW_USA_infrastructure_expansion_desc:0 "Our nation's transportation network is woefully lacking considering the advancement of motor vehicle and railway technology. We should focus on building an interstate highway and rail system to improve the flow of materials nationwide."
 AAW_USA_farmer_relief_plan:0 "Dust Bowl Farmer Relief Plan"
 AAW_USA_farmer_relief_plan_desc:0 "The Great Plains farming community has been wrecked by the Dust Bowl. We should aid these farmers even further so the country's bread basket returns to its former glory."
 AAW_USA_soil_conservation_service:0 "Soil Conservation Service"
 AAW_USA_soil_conservation_service_desc:0 "Agriculture and conservation thinking has improved drastically in the last few years. The failed harvests of the Great War will no longer be a concern if we use brand new soil preservation techniques to boost harvest yields and consistency."
 AAW_USA_veterans_affairs_commission:0 "Veterans Affairs Commission"
 AAW_USA_veterans_affairs_commission_desc:0 "Adjusting the compensation for our veterans helped, but we should go a step further. We wish to avoid expanding federal power further, so we should look into how we can support the states in providing better care to our veterans."
 AAW_USA_hire_veterans_initiative:0 "Hire Veterans Initiative"
 AAW_USA_hire_veterans_initiative_desc:0 "Our industry is expanding at a rapid rate. With many veterans from past wars suffering from the Great Depression, we should push businesses to hire those who served in positions as they open by providing incentives such as tax breaks."
 AAW_USA_reorganize_labor_department:0 "Reorganize Labor Department"
 AAW_USA_reorganize_labor_department_desc:0 "With workers across the country organizing and threatening strikes, businesses have come to the federal government asking for help. We should reorganize the Labor Department to deal with this effectively."
 AAW_USA_shut_down_new_deal_agencies:0 "Shut Down New Deal Agencies"
 AAW_USA_shut_down_new_deal_agencies_desc:0 "The former administration was far too aggressive in their use of federal power to fight the Great Depression. We need to shut down many of the agencies created by the New Deal and spend taxpayer money elsewhere."
 AAW_USA_90_division_gamble:0 "90 Division Gamble"
 AAW_USA_90_division_gamble_desc:0 "Government and military officials alike believe we won't have enough material to field a large army. We should focus on training and equipping a smaller number of divisions. Although the number of divisions may not match a country like Germany under this plan, these divisions will pack a heavier punch and have a larger unit structure."
 AAW_USA_victory_program:0 "Victory Program"
 AAW_USA_victory_program_desc:0 "We must prepare for a possible collaspe of the Soviet armies similar to the events of the Russian Revolution of 1917. Under the Victory Program, we could field a larger army capable of matching the German Wehrmacht on multiple fronts. To do so, we'll need to rapidly expand our industrial output."
 AAW_USA_american_democracy:0 "American Democracy"
 AAW_USA_american_democracy_desc:0 "The American republic has been a beacon of hope for those seeking individual freedom since its founding. We must continue on the path set forth for us by the Founding Fathers."
 AAW_USA_americas_rebirth:0 "America's Rebirth"  
 AAW_USA_americas_rebirth_desc:0 "For too long the democratic system has led our country astray. America needs a change and needs it now to avoid a disaster!"
 AAW_USA_american_socialism:0 "American Socialism"
 AAW_USA_american_socialism_desc:0 "Earl Browder is the wrong choice for America. He believes in the methods of Stalin that has led the birthplace of the Revolution to a path of ruin. Norman Thomas is the clear best choice for the American people."  
 AAW_USA_american_communism:0 "American Communism"
 AAW_USA_american_communism_desc:0 "Norman Thomas is too weak for America. Earl Browder believes in strengthening not only the American worker, but also our military might to prevent our proud nation from falling behind the capitalists of the world."
 AAW_USA_isolationism:0 "Isolationism"  
 AAW_USA_isolationism_desc:0 "The War To End All Wars clearly wasn't the end. Tensions continue to rise and another war is likely to be unfurled. We must avoid the mistake of entering yet another European war."
 AAW_USA_give_japanese_pacific_claims:0 "Accept Japanese Demands"
 AAW_USA_give_japanese_pacific_claims_desc:0 "Going back to the Treaty of Versailles, the Japanese have claimed our territories of Guam and Wake Island in the Pacific. To avoid a potential war with them, we should give them what was originally promised in the Japanese Mandate."  
 AAW_USA_north_american_revolution:0 "North American Revolution"
 AAW_USA_north_american_revolution_desc:0 "With the homefront secured against the capitalist threat, we must look to beyond our borders for the threats we've always known about. Let America stand as the new beacon of the Workers' Revolution!"
 AAW_USA_american_revolutionary_university:0 "American Revolutionary University"  
 AAW_USA_american_revolutionary_university_desc:0 "With the revolution complete, we should create a university to promote not only our new ideals, but also advance our technological capabilities."  
 AAW_USA_american_ingenuity:0 "American Ingenuity"  
 AAW_USA_american_ingenuity_desc:0 "Even in the toughest of situations, America has always prevailed and emerged for the better. We may still be dealing with the effects of the Great Depression, but that just means we'll work even harder and become better for it. We can't devote all requested resources to our research, but our scientists can make do!"
 AAW_USA_embrace_the_1934_declaration_of_principles:0 "Embrace the 1934 Declaration of Principles"
 AAW_USA_embrace_the_1934_declaration_of_principles_desc:0 "The 1934 Declaration of Principles, supported by none other than President Norman Thomas himself, proclaimed that supporting international war of any kind and allowing the false democracy of the capitalists to continue is against the ideals of the United States. We should make sure our comrades embrace and believe in this."
 AAW_USA_farmer_labor_act:0 "Farmer-Labor Act"  
 AAW_USA_farmer_labor_act_desc:0 "To support only one type of worker is anti-socialist and anti-American. We should enable both the factory worker and farmers to reach the American Dream!"
 AAW_USA_government_decentralization:0 "Federal Decentralization"
 AAW_USA_government_decentralization_desc:0 "We don't believe in the ideology of Stalin where workers should be brought together into central, state-owned factories. We believe in the power of the workers! Let's dismantle the centralization brought forth by Roosevelt's New Deal and allow workers to share equally in the resources."  
 AAW_USA_rural_development:0 "Rural Development"
 AAW_USA_rural_development_desc:0 "Our rural communities in the Great Plains have been lacking investment from the government for decades. Let's rejuvenate this area for the farmers of America!"
 AAW_USA_rural_development_tt:0 "Add one level of §YInfrastructure§! in §YOklahoma§!, §YKansas§!, §YNebraska§!, §YWyoming§! and §YColorado§!"
 AAW_USA_workers_democracy:0 "Workers' Democracy"  
 AAW_USA_workers_democracy_desc:0 "American democracy was built on giving power to the people. While we still believe in this ideal, our new government believes in expanding focus to the American worker and the sacrifices they make to ensure our country thrives."
 AAW_USA_bureau_of_social_reform:0 "Bureau of Social Reform"
 AAW_USA_bureau_of_social_reform_desc:0 "Norman Thomas believes not in permanent revolution, but in permanent social reform. Let's create a government office dedicated to this mentality."  
 AAW_USA_for_the_workers_by_the_workers:0 "For the Workers, by the Workers"
 AAW_USA_for_the_workers_by_the_workers_desc:0 "A government for the people, by the people has been an American motto since our founding. We should revamp this into a modern form suitable to a government dedicated to the American worker."
 AAW_USA_silver_shirt_legions:0 "Silver Shirt Legions"  
 AAW_USA_silver_shirt_legions_desc:0 "The Free Corps has been clamoring to be allowed to form their own dedicated homefront divisions, freeing up space for our frontline troops. Doing so would allow our garrisons to be more efficient and stronger."  
 AAW_USA_military_industrial_complex:0 "Military Industrial Complex"  
 AAW_USA_military_industrial_complex_desc:0 "Private enterprises are begging for the opportunity to expand our military power. We should support this endeavor to help our future territory expansion."  
 AAW_USA_defense_institute_of_technology:0 "Defense Institute of Technology"  
 AAW_USA_defense_institute_of_technology_desc:0 "American research power has been lacking since before the Great War. In order to expand our territory, we need to change that and fast. Allowing the military to establish a brand new research center will quickly solve this dilemma."
 AAW_USA_jets_focus:0 "Project Airacomet"
 AAW_USA_jets_focus_desc:0 "New advancements in jet engines make the top of the class propeller aircraft look like paper kites drifting aimlessly. The new age of aerial combat is here and will be dominated by the jet engine. If we pool our investments into the field together, we can leapfrog our enemies and produce the top of the aircraft food chain."  
 AAW_USA_rocketry_focus:0 "Rocketry"  
 AAW_USA_rocketry_focus_desc:0 "Rocket propulsion promises to allow planes and projectiles to travel faster and farther than ever before for our armed forces. We should research the use of this brand new technology more."  
 AAW_USA_intervention_mandates:0 "Intervention Mandates"  
 AAW_USA_intervention_mandates_desc:0 "With countries showing aggression across the world, we must be prepared to intervene whenever necessary to preserve democracy and national automony for peoples across the world. Due to our consitution, congressional approval is still needed, but we can easily sway them to our side."
 AAW_USA_industrial_revitalization:0 "Industrial Revitalization"  
 AAW_USA_industrial_revitalization_desc:0 "In order to properly intervene in any war, we must first focus on American industry. Our industry still suffers from the Great Depression, but with proper funding we can easily get our factory production back to maximum efficency."
 AAW_USA_spanish_civil_war_aid:0 "Spanish Civil War Refugees"  
 AAW_USA_spanish_civil_war_aid_desc:0 "Democracy is under attack in Spain. All parts of the political spectrum are taking part, resulting in a catastrophic humanitarian crisis. If we allow refugees into the country, we can help alleviate the suffering. The isolationism elements of our populace may be upset by the action, but the refugees telling their stories will surely boost support for military action." 
 AAW_USA_the_homefront:0 "The Homefront"
 AAW_USA_the_homefront_desc:0 "Our troops in the field can't fight at their best if there's worries at home. Secondly, our civilians at home who help fuel the war effort can not only contribute personally, but they also need high morale. Creating an information office to keep the homefront happy and productive will pay dividends to our military production."
