 AAW_USA_lindbergh_speeches:0 "Lindbergh Speech Tour"
 AAW_USA_lindbergh_speeches_desc:0 "To promote the growth of American First and American fascism, we should utilize one of our best resources in Charles Lindbergh. With his strong, natural charisma and celebrity status, he can easily sway the people to our cause."
 AAW_USA_remember_the_founding_fathers:0 "Remember the Founding Fathers"
 AAW_USA_remember_the_founding_fathers_desc:0 "Although many view our organization as extremist, we can appeal to the majority of Americans by drawing to how strong and prepared for anything the likes of George Washington and Thomas Jefferson wanted our great country to be."
 AAW_USA_organize_worker_rallies:0 "Organize National Worker Rallies"
 AAW_USA_organize_worker_rallies_desc:0 "The American worker is the backbone of our country. They provide not only for their families and communities, but also for the entire country's survival. Organizing national days of worker rallies to show this will help illustrate the power the workers have and bolster our support among their communities." 
 AAW_USA_labor_union_promises:0 "Labor Union Promises"
 AAW_USA_labor_union_promises_desc:0 "Labor unions are another strong source of our influence. Providing them promises of future support and favorable legislation should help us gain even more support among those who provide for all." 
 AAW_USA_south_american_revolution:0 "South American Revolution"
 AAW_USA_south_american_revolution_desc:0 "Our march did not simply end in Central America and the Caribbean. The people of South America will also know the glory of our Workers' Revolution!"
 AAW_USA_central_american_revolution:0 "Central American and Caribbean Revolution"
 AAW_USA_central_american_revolution_desc:0 "Our neighbors in North America were only the beginning of the Workers' Revolution. Let's take aim at those closer to South America and bring American glory to the people there."
 AAW_USA_integrate_the_revolutions:0 "Integrate the Revolutionaries"
 AAW_USA_integrate_the_revolutions_desc:0 "With the Americas secured and under our control, we can now begin the process of integrating the people into one great, unified Communist country that will stand as a beacon to all peoples of the world."
 AAW_USA_north_american_revolution_tt:0 "Gain §Y$annex_everything$§! wargoal on all §YNon-Communist§! nations in §YNorth America§!"
 AAW_USA_central_american_revolution_tt:0 "Gain §Y$annex_everything$§! wargoal on all §YNon-Communist§! nations in §YCentral America and the Caribbean§!"
 AAW_USA_south_american_revolution_tt:0 "Gain §Y$annex_everything$§! wargoal on all §YNon-Communist§! nations in §YSouth America§!"
