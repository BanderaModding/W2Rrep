 AAW_USA_growing_nationalism:0 "Growing Nationalism" 
 AAW_USA_growing_nationalism_desc:0 "After the Great War and the Great Depression, the United States has been falling behind the other great powers of the world. This has to change and the people are ready for us to take center stage in world politics. Only through sheer military power and will can we finally become what we're meant to be."
 AAW_USA_growing_nationalism_intro_tt:0 "Modify §YGrowing Nationalism§! by:"
 AAW_USA_growing_communism:0 "Growing Communism" 
 AAW_USA_growing_communism_desc:0 "The American worker has been neglected for far too long. Awareness of the struggle has spread from the factories to the cities and farms of Ameria with many ready to finally fight for a change."
 AAW_USA_growing_communism_intro_tt:0 "Modify §YGrowing Communism§! by:"
 AAW_USA_us_army_focus:0 "U.S. Army"
 AAW_USA_us_army_focus_desc:0 "Warfare has changed drastically since the Great War. Modern wars require a modern military. If we are to step onto the world stage, the United States Army must be revamped and improved upon."
