 bm_napalm_bomb_1:0 "Напалмовые бомбы"
 bm_napalm_bomb_1_desc:0 "Напалмовая бомба наносит разрушительный удар по площади, распыляя горючее вещество и причиняя огромный ущерб на большой территории."
