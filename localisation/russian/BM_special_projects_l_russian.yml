 bm_explosive_reactive_armor_1:0 "Взрывная реактивная броня"
 bm_explosive_reactive_armor_1_desc:0 "Разработайте технологию взрывной реактивной брони (ВРБ) для повышения живучести бронетехники."
 bm_explosive_reactive_armor_project:0 "Взрывная реактивная броня"
 bm_explosive_reactive_armor_project_desc:0 "Разработка технологии взрывной реактивной брони (ВРБ) для повышения живучести бронетехники. Обеспечивает значительную защиту от противотанкового оружия."
 bm_explosive_reactive_armor_project_module_tt:0 "\n£$ICON$  $NAME|Y$ \n\n$DESC$"
 bm_explosive_reactive_armor_project_reward_1:0 "Приоритет учёных"
 bm_explosive_reactive_armor_project_reward_1_desc:0 "Получите умеренный бонус к прогрессу для ускорения исследований или рискните получить небольшой бонус к опыту учёного либо черту «Специалист по бронетехнике»."
 bm_explosive_reactive_armor_project_option_1:0 "Умеренный прорыв"
 bm_explosive_reactive_armor_project_option_2:0 "Специалист по бронетехнике"

 bm_combat_drugs_project:0 "Боевые стимуляторы"
 bm_combat_drugs_project_desc:0 "Чтобы получить военное превосходство, ваши учёные предлагают разработать препараты для повышения физических и умственных возможностей солдат."
 bm_combat_drugs_project_tt:0 "\n£$ICON$  $NAME|Y$ \n\n$DESC$"
 bm_combat_drugs_project_tt_name:0 "Боевые стимуляторы"
 bm_combat_drugs_project_tt_desc:0 "Специализированные боевые препараты, предназначенные для повышения физических и умственных возможностей солдат на поле боя."
 bm_combat_drugs_project_reward:0 "Этические дилеммы"
 bm_combat_drugs_project_reward_desc:0 "Стремясь повысить боевую эффективность, ваши учёные предлагают разработать препараты, улучшающие характеристики солдат. Однако испытания этих веществ поднимают этические вопросы, и вашей стране предстоит решить, как поступить."
 bm_combat_drugs_project_reward_animal_testing:0 "Испытания на животных"
 bm_combat_drugs_project_reward_animal_testing_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n\n§YЭффекты§!§W:"
 bm_combat_drugs_project_reward_animal_testing_tt_name:0 "Испытания на животных"
 bm_combat_drugs_project_reward_animal_testing_tt_desc:0 "Используйте животных для изучения действия предлагаемых боевых препаратов. Такой подход ускоряет разработку, но вызывает этические вопросы."
 bm_sp_combat_drugs_animal_testing:0 "Боевые стимуляторы"
 bm_sp_combat_drugs_animal_testing_desc:0 "Специализированные боевые препараты, предназначенные для повышения физических и умственных возможностей солдат на поле боя."
 bm_combat_drugs_project_reward_human_testing:0 "Эксперименты на людях"
 bm_combat_drugs_project_reward_human_testing_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n\n§YЭффекты§!§W:"
 bm_combat_drugs_project_reward_human_testing_tt_name:0 "Эксперименты на людях"
 bm_combat_drugs_project_reward_human_testing_tt_desc:0 "Проводите испытания на людях в контролируемых условиях. Хотя этот метод ближе к этическим нормам, он медленнее и несёт риски, если информация об испытаниях станет известна."
 bm_sp_combat_drugs_human_testing:0 "Боевые стимуляторы"
 bm_sp_combat_drugs_human_testing_desc:0 "Специализированные боевые препараты, предназначенные для повышения физических и умственных возможностей солдат на поле боя."

 bm_gatling_autocannon_1:0 "Автоматическая пушка Гатлинга"
 bm_gatling_autocannon_1_desc:0 "Многоствольная автоматическая пушка с высокой скорострельностью."
 bm_gatling_autocannon_project:0 "Автоматическая пушка Гатлинга"
 bm_gatling_autocannon_project_desc:0 "Интеграция многоствольной автоматической пушки с высокой скорострельностью. Повышает огневую мощь самолётов благодаря установке пушки типа Гатлинга, способной вести быстрый огонь разрушительными очередями."
 bm_gatling_autocannon_project_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_gatling_autocannon_project_template_reward:0 "Приоритет проектирования"
 bm_gatling_autocannon_project_template_reward_desc:0 "Даёт значительный бонус к следующим проектам самолётов."
 bm_gatling_autocannon_project_template_reward_option_1:0 "Малый планер"
 bm_gatling_autocannon_project_template_reward_option_2:0 "Средний планер"
 bm_gatling_autocannon_project_template_reward_option_3:0 "Тяжёлый планер"
 bm_gatling_autocannon_project_template_bonus_1:0 "§YМалый планер§!"
 bm_gatling_autocannon_project_template_bonus_2:0 "§YСредний планер§!"
 bm_gatling_autocannon_project_template_bonus_3:0 "§YТяжёлый планер§!"
 bm_gatling_autocannon_project_tt_desc:0 "Многоствольная автоматическая пушка с высокой скорострельностью. Способна вести быстрый огонь разрушительными очередями."

 bm_gravitational_suit_project_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_gravitational_suit_project:0 "Противоперегрузочный костюм"
 bm_gravitational_suit_project_desc:0 "По мере роста скорости самолётов пилотам нужны более качественная подготовка и экипировка для переносимости перегрузок. Противоперегрузочный костюм повышает устойчивость к перегрузкам, а вместе с превосходной подготовкой даёт нашим пилотам преимущество в воздушном бою."
 bm_gravitational_suit_tip_tt:0 "Вы можете снизить требуемую стоимость прорыва для этого проекта до §Y1§!, изучив $TECH_1|Y$, а также $TECH_2|Y$ или $TECH_3|Y$."
 bm_gravitational_suit_1:0 "Малый противоперегрузочный костюм"
 bm_gravitational_suit_1_desc:0 "Противоперегрузочный костюм, или G-костюм, повышает устойчивость наших пилотов к перегрузкам. В сочетании с превосходной подготовкой это может дать нашим пилотам преимущество в воздухе над полем боя."
 bm_gravitational_suit_2:0 "Средний противоперегрузочный костюм"
 bm_gravitational_suit_2_desc:0 "Противоперегрузочный костюм, или G-костюм, повышает устойчивость наших пилотов к перегрузкам. В сочетании с превосходной подготовкой это может дать нашим пилотам преимущество в воздухе над полем боя."
 bm_gravitational_suit:0 "Противоперегрузочный костюм"
 bm_gravitational_suit_desc:0 "Противоперегрузочный костюм, или G-костюм, повышает устойчивость наших пилотов к перегрузкам."

 bm_anti_aircraft_system_project:0 "Зенитная система"
 bm_anti_aircraft_system_project_desc:0 "Передовые морские платформы, оснащённые новейшими зенитными ракетными технологиями. Повышают способность флота защищаться от атак с воздуха и обеспечивают дальнюю защиту ключевых морских объектов."
 bm_anti_aircraft_system_1:0 "Зенитная система"
 bm_anti_aircraft_system_1_desc:0 "Передовые зенитные ракетные системы, повышающие способность перехватывать и уничтожать приближающиеся вражеские самолёты."
 bm_anti_aircraft_system_project_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"

 bm_anti_aircraft_truck_project:0 "Моторизованные зенитные ракеты"
 bm_anti_aircraft_truck_project_desc:0 "Мобильная система ПВО — зенитный ракетный грузовик, предназначенный для гибкой противовоздушной поддержки на поле боя и эффективного противодействия воздушным угрозам."
 bm_anti_aircraft_truck_equipment:0 "Зенитный грузовик"
 bm_anti_aircraft_truck_equipment_desc:0 "Мобильная система ПВО, обеспечивающая гибкую противовоздушную поддержку на поле боя."
 bm_anti_aircraft_truck_equipment_0:0 "Зенитный грузовик"
 bm_anti_aircraft_truck_equipment_0_desc:0 "Мобильная система ПВО, обеспечивающая гибкую противовоздушную поддержку на поле боя."
 bm_anti_aircraft_truck_project_tt_eq:0 "§YОткрыть оборудование:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_anti_aircraft_truck_project_tt_unit:0 "§YОткрыть оборудование:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_motorized_guided_anti_air:0 "Моторизованная управляемая ПВО"
 bm_motorized_guided_anti_air_desc:0 "Используется для эффективного противодействия воздушным угрозам противника."

 bm_swept_wing_1:0 "Стреловидное крыло"
 bm_swept_wing_1_desc:0 "Улучшает характеристики и устойчивость на высокой скорости. Стреловидная форма крыла уменьшает сопротивление и повышает манёвренность."
 bm_swept_wing_project:0 "Стреловидные крылья"
 bm_swept_wing_project_desc:0 "Значительно повышают эффективность наших ВВС. Стреловидная форма крыльев уменьшает сопротивление на высокой скорости, улучшая устойчивость и позволяя создавать более быстрые и манёвренные самолёты."
 bm_swept_wing_project_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"

 bm_delta_wing_1:0 "Треугольное крыло"
 bm_delta_wing_1_desc:0 "Треугольная, или дельтавидная, конструкция. Такая конфигурация улучшает характеристики на высокой скорости и повышает устойчивость на сверхзвуке, что особенно эффективно для перехватчиков и истребителей."
 bm_delta_wing_project:0 "Треугольные крылья"
 bm_delta_wing_project_desc:0 "Высокопроизводительные самолёты с характерной треугольной формой крыла. Такая конструкция обеспечивает превосходную манёвренность на высокой скорости и повышенную устойчивость как на дозвуковых, так и на сверхзвуковых скоростях."
 bm_delta_wing_project_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"

 bm_industry_efficiency_project:0 "Эффективность промышленности"
 bm_industry_efficiency_project_desc:0 "Значительно повысить эффективность наших фабрик. Возможность модернизировать производственные мощности, сосредоточившись либо на расширении военного производства, либо на укреплении гражданской промышленной базы."
 bm_industry_efficiency_mil_dynamic_modifier:0 "Эффективность военной промышленности"
 bm_industry_efficiency_mil_dynamic_modifier_desc:0 "Оптимизация производства военных материалов для повышения скорости и объёма выпуска военных заводов."
 bm_industry_efficiency_civ_dynamic_modifier:0 "Эффективность гражданской промышленности"
 bm_industry_efficiency_civ_dynamic_modifier_desc:0 "Передовые производственные методы, более эффективное управление ресурсами и улучшенные трудовые практики позволяют увеличить выпуск гражданских товаров."
 bm_industry_efficiency_project_rewards:0 "Промышленный приоритет"
 bm_industry_efficiency_project_rewards_desc:0 "Повысить эффективность наших фабрик. Возможность модернизировать производственные мощности."
 bm_industry_efficiency_project_option_civ_option:0 "Эффективность гражданской промышленности"
 bm_industry_efficiency_project_option_mil_option:0 "Эффективность военной промышленности"
 bm_industry_efficiency_project_tt:0 "По завершении этого проекта вы получите либо §Yэффективность гражданской промышленности§!, либо §Yэффективность военной промышленности§! — в зависимости от вашего выбора.\n\n"
 bm_industry_efficiency_project_option_civ_option_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n"
 bm_industry_efficiency_project_option_mil_option_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n"
 bm_industry_efficiency_project_tip_tt:0 "Вы можете снизить требуемую стоимость прорыва для этого проекта до §Y0§!, изучив $TECH_1|Y$, а также $TECH_2|Y$ или $TECH_3|Y$."

 bm_anti_ship_launcher_1:0 "Пусковая установка противокорабельных ракет"
 bm_anti_ship_launcher_1_desc:0 "Передовые противокорабельные ракетные системы, повышающие способность поражать и уничтожать вражеские корабли на расстоянии."
 bm_anti_ship_missile_project:0 "Противокорабельная ракета"
 bm_anti_ship_missile_project_desc:0 "Сосредоточено на разработке и развертывании передовых противокорабельных ракетных систем, способных поражать вражеские суда с непревзойдённой точностью и мощью."
 bm_anti_ship_missile_desc_tt:0 "Противокорабельная ракета — это управляемая ракета, предназначенная для поражения кораблей и крупных судов."
 bm_anti_ship_missile_project_missile_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n"
 bm_anti_ship_missile_project_module_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$\n\n\n$DESC$\n"
 bm_anti_ship_missile_project_reward:0 "Приоритет бонуса"
 bm_anti_ship_missile_project_reward_desc:0 "Сосредоточьтесь на улучшении шаблона эсминца или шаблона крейсера."
 bm_anti_ship_missile_project_option_1:0 "Бонус шаблона эсминца"
 bm_anti_ship_missile_project_option_2:0 "Бонус шаблона крейсера"
 bm_anti_ship_missile_project_template_bonus_1:0 "Улучшенный эсминец и передовой эсминец"
 bm_anti_ship_missile_project_template_bonus_2:0 "Улучшенный крейсер и передовой крейсер"
 bm_anti_ship_missile_project_tip_tt:0 "Вы можете снизить требуемую стоимость прорыва для этого проекта до §Y1§!, изучив $TECH_1|Y$."

 bm_packed_hanger_deck_1:0 "Плотная ангарная палуба"
 bm_packed_hanger_deck_1_desc:0 "Максимизирует размещение самолётов на авианосцах, увеличивая вместимость авиакрыла ценой повышения стоимости производства и снижения оперативной гибкости."
 bm_packed_hanger_deck_project:0 "Плотная ангарная палуба"
 bm_packed_hanger_deck_project_desc:0 "Переработка ангарных систем авианосцев для максимального размещения самолётов значительно увеличивает вместимость авиакрыла. Позволяет авианосцам нести больше самолётов, обеспечивая решающее преимущество в морских сражениях."
 bm_packed_hanger_deck_project_deck_desc_tt:0 "Хотя это улучшение усиливает проекцию воздушной мощи авианосца, оно повышает стоимость производства и снижает оперативную гибкость."
 bm_packed_hanger_deck_project_deck_tt:0 "\n£$ICON$  $NAME|Y$\n\n$DESC$\n"
 bm_packed_hanger_deck_project_packed_tt:0 "§YМодуль оборудования:§!\n$NAME$ \n\n£$ICON$\n\n\n$DESC$\n"
 bm_packed_hanger_deck_project_reward:0 "Морская дилемма"
 bm_packed_hanger_deck_project_reward_desc:0 "Пока исследователи вашей страны расширяют границы военно-морских технологий, вам предстоит определить направление их усилий:"
 bm_packed_hanger_deck_project_reward_option_1:0 "Бонус к технологиям авианосцев"
 bm_packed_hanger_deck_project_reward_option_2:0 "Бонус шаблона авианосца"
 bm_packed_hanger_deck_project_reward_tech_bonus:0 "Технологии авианосцев"
 bm_packed_hanger_deck_project_reward_design_bonus:0 "Корпус авианосца"
 bm_packed_hanger_deck_project_tip_tt:0 "Вы можете снизить требуемую стоимость прорыва для этого проекта до §Y0§!, изучив $TECH_1|Y$."

 bm_attack_helicopter_equipment:0 "Ударный вертолёт"
 bm_attack_helicopter_equipment_desc:0 "Универсальный боевой летательный аппарат, предназначенный для непосредственной авиационной поддержки, борьбы с бронетехникой и разведки на поле боя."
 bm_attack_helicopter_equipment_0:0 "Ударный вертолёт"
 bm_attack_helicopter_equipment_0_desc:0 "Универсальный боевой летательный аппарат, предназначенный для непосредственной авиационной поддержки, борьбы с бронетехникой и разведки на поле боя."
 bm_attack_helicopter_company:0 "Рота ударных вертолётов"
 bm_attack_helicopter_company_desc:0 "Обеспечивает огневую мощь с воздуха, возможности борьбы с бронетехникой и улучшенную разведку поля боя. Повышает мобильность и эффективность сухопутных войск."
 bm_attack_helicopter_project:0 "Ударный вертолёт"
 bm_attack_helicopter_project_desc:0 "Передовые ударные вертолёты, предназначенные для непосредственной авиационной поддержки и борьбы с бронетехникой, повышают мобильность, огневую мощь и гибкость ваших сухопутных войск."
 bm_attack_helicopter_project_helicopter_tt:0 "§YОткрыть оборудование:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_attack_helicopter_project_unit_tt:0 "§YОткрыть подразделение:§!\n$NAME$ \n\n£$ICON$ \n\n$DESC$"
 bm_attack_helicopter_project_reward:0 "Боевой приоритет"
 bm_attack_helicopter_project_reward_desc:0 "Повысьте эффективность ударных вертолётов, сосредоточившись либо на передовых ракетных системах для усиления атаки по бронецелям, либо на улучшенном вооружении боевых вертолётов для повышения атаки по мягким целям, пехоте и лёгкой бронетехнике."
 bm_attack_helicopter_eq_bonus_soft:0 "Улучшение вооружения боевых вертолётов"
 bm_attack_helicopter_eq_bonus_hard:0 "Улучшение передовых ракетных систем"
 bm_attack_helicopter_project_soft:0 "Улучшение вооружения боевых вертолётов"
 bm_attack_helicopter_project_hard:0 "Улучшение передовых ракетных систем"

 bm_manpads_equipment:0 "Переносной зенитный ракетный комплекс"
 bm_manpads_equipment_desc:0 "Переносные зенитные ракеты с плечевым пуском. Это управляемое оружие, представляющее угрозу для летательных аппаратов."
 bm_manpads_equipment_0:0 "Переносной зенитный ракетный комплекс"
