 bm_enhanced_cipher_project:0 "Вычислительная криптология"
 bm_enhanced_cipher_project_desc:0 "Выберите между совершенствованием криптографических возможностей для улучшения шифрования и дешифрования или укреплением разведывательной сети для более эффективного сбора и анализа информации о противнике."
