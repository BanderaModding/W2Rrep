 bm_canines_project:0 "Служебные собаки"
 bm_canines_project_desc:0 "Включите специально обученных военных собак в разведывательные и военные полицейские подразделения, получив значительный бонус к разведке и безопасности. Эти верные помощники улучшают разведывательные возможности, обнаруживают скрытые угрозы, эффективно отслеживают перемещения противника и помогают поддерживать порядок и дисциплину."
