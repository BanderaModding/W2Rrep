 bm_tracked_mine_project:0 "Гусеничная мина"
 bm_tracked_mine_project_desc:0 "Дистанционно управляемое взрывное средство. Также позволяет развернуть специализированное подразделение поддержки для применения этих гусеничных мин, обеспечивая преимущество в инженерных операциях и диверсиях и позволяя точно поражать вражеские укрепления и бронетехнику."
 bm_tracked_mine_equipment:0 "Гусеничная мина"
 bm_tracked_mine_equipment_desc:0 "Дистанционно управляемое взрывное устройство на гусеничном ходу, предназначенное для движения по пересечённой местности и доставки заряда непосредственно к вражеской цели."
