 bm_stealth_jet_project:0 "Программа малозаметных самолётов"
 bm_stealth_jet_project_desc:0 "Два передовых самолёта. Малозаметный бомбардировщик, способный с высокой точностью наносить удары, избегая обнаружения противником, и малозаметный истребитель, предназначенный для господства в воздухе благодаря исключительной манёвренности и скрытности."
 bm_stealth_bomber_equipment:0 "Малозаметный бомбардировщик"
