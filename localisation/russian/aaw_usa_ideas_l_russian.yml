 AAW_USA_growing_nationalism_desc:0 "После Великой войны и Великой депрессии США отстают от других великих держав. Это должно измениться - народ готов к нашему выходу на мировую арену. Только через военную мощь и силу воли мы станем тем, кем должны быть."
