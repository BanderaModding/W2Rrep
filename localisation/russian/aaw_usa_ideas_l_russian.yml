 AAW_USA_growing_communism:0 "Рост коммунизма"
 AAW_USA_growing_communism_desc:0 "Американский рабочий слишком долго был забыт. Осознание борьбы распространилось с заводов на города и фермы Америки - многие готовы бороться за перемены."
