 AAW_USA_us_army_focus:0 "Армия США"
 AAW_USA_us_army_focus_desc:0 "Война радикально изменилась со времён Великой войны. Современные войны требуют современной армии. Если мы хотим выйти на мировую арену, Армию США необходимо модернизировать."
