 AAW_USA_lindbergh_speeches:0 "Тур выступлений Линдберга"
 AAW_USA_lindbergh_speeches_desc:0 "Для продвижения идей «Америка прежде всего» и американского фашизма следует задействовать Чарльза Линдберга. Его харизма и известность помогут склонить народ на нашу сторону."
 AAW_USA_remember_the_founding_fathers:0 "Помнить Отцов-основателей"
 AAW_USA_remember_the_founding_fathers_desc:0 "Хотя многие считают нашу организацию радикальной, мы можем апеллировать к большинству американцев, напоминая, какую сильную и готовую ко всему страну хотели видеть Джордж Вашингтон и Томас Джефферсон."
 AAW_USA_organize_worker_rallies:0 "Организовать национальные рабочие митинги"
 AAW_USA_organize_worker_rallies_desc:0 "Американский рабочий - становой хребет нашей страны. Они обеспечивают не только свои семьи, но и выживание всей нации. Национальные дни рабочих митингов продемонстрируют их силу и укрепят нашу поддержку." 
 AAW_USA_labor_union_promises:0 "Обещания профсоюзам"
 AAW_USA_labor_union_promises_desc:0 "Профсоюзы - важный источник нашего влияния. Обещая им поддержку и выгодные законы, мы укрепим свои позиции среди тех, кто кормит страну." 
 AAW_USA_south_american_revolution:0 "Южноамериканская революция"
 AAW_USA_south_american_revolution_desc:0 "Наш марш не закончится в Центральной Америке. Народы Южной Америки тоже познают славу Рабочей революции!"
 AAW_USA_central_american_revolution:0 "Революция в Центральной Америке и Карибах"
 AAW_USA_central_american_revolution_desc:0 "Наши северные соседи были лишь началом. Принесём славу американской революции народам ближе к Южной Америке."
 AAW_USA_integrate_the_revolutions:0 "Интегрировать революционеров"
 AAW_USA_integrate_the_revolutions_desc:0 "С Америкой под контролем мы можем объединить народы в великую коммунистическую страну - маяк для всего мира."
