l_russian:
 USA_focus:0 "Национальные фокусы США"
 AAW_USA_office_of_strategic_services:0 "Управление стратегических служб"
 AAW_USA_office_of_strategic_services_desc:0 "Создание специализированного разведывательного агентства поможет не только в войне, но и в будущих операциях за рубежом. Британские спецслужбы могут послужить образцом."
 AAW_USA_wartime_industry:0 "Военная промышленность"
 AAW_USA_wartime_industry_desc:0 "У нас сильная промышленность, но не вся она приспособлена для производства военных материалов. Разработка эффективных процессов для этой трансформации станет ключом к использованию наших ресурсов."
 AAW_USA_first_special_service_force:0 "Первые специальные службы"
 AAW_USA_first_special_service_force_desc:0 "Операции в тылу врага на неблагоприятной территории станут частью любого глобального конфликта. Создание коммандос для таких задач крайне важно для будущих войн."
 AAW_USA_rubber_reserve_company:0 "Компания по резервированию каучука"
 AAW_USA_rubber_reserve_company_desc:0 "С началом войны мы потеряли почти все источники импортного каучука.\n\nОгромные скоординированные усилия американских каучуковых компаний могут помочь найти лучшие методы производства синтетического каучука, возможно, даже покрывая военные нужды."
 AAW_USA_manifest_destiny:0 "Явное предначертание"
 AAW_USA_manifest_destiny_desc:0 "Особые обстоятельства основания нашей нации и её истории дают нам мандат действовать против несправедливости и угнетения по всему миру. Чтобы создать безопасное международное сообщество, нашим главным экспортом должна быть свобода."
 AAW_USA_manifest_destiny_tt:0 "§YДаёт цели войны против всех фашистских и коммунистических стран.§!\n"
 AAW_USA_scientist_haven:0 "Отдел исследований и анализа"
 AAW_USA_scientist_haven_desc:0 "Провозгласив себя защитниками мира, мы можем приветствовать учёных и интеллектуалов, изгнанных режимами за рубежом, давая им шанс на успех и помощь нашему делу в стране возможностей."
 AAW_USA_wpa:0 "Расширить Администрацию прогресса работ"
 AAW_USA_wpa_desc:0 "Миллионы людей до сих пор страдают от безработицы, вызванной Великой депрессией. Агентство, которое займёт их на общественных проектах, может не решить проблему полностью, но это шаг в правильном направлении."
 AAW_USA_committee_on_technocracy:0 "Комитет по технократии"
 AAW_USA_committee_on_technocracy_desc:0 "Мы должны заменить некоторых политиков и бизнесменов учёными и инженерами. Их техническая экспертиза поможет управлять экономикой, что приведёт к научному прогрессу и её восстановлению."
 AAW_USA_support_rock_island:0 "Поддержка арсенала Рок-Айленд"
 AAW_USA_support_rock_island_desc:0 "Поддержка наших войск любыми способами - ключ к победе. Будь то артиллерийская поддержка с расстояния или непосредственная помощь на поле боя. Мы должны обеспечить их всем необходимым."
 AAW_USA_military_construction:0 "Военное строительство"
 AAW_USA_military_construction_desc:0 "Угрожая миру, сверхдержавы вынуждают нас направлять общественные проекты не только на гражданские, но и на военные нужды."
 AAW_USA_USACE_projects:0 "Проекты Корпуса инженеров США"
 AAW_USA_USACE_projects_desc:0 "Инженерный корпус армии США займётся созданием инфраструктуры для будущих военных проектов, каких мир ещё не видел. Вперёд!"
 AAW_USA_arsenal_of_democracy:0 "Арсенал демократии"
 AAW_USA_arsenal_of_democracy_desc:0 "Независимо от нашего прямого вмешательства в войну, демократические страны должны знать, что мы будем их вооружать и поддерживать."
 AAW_USA_liberty_ships:0 "Корабли свободы"
 AAW_USA_liberty_ships_desc:0 "Массовое производство грузовых судов должно сопровождать наше промышленное развитие, чтобы обеспечить доставку материалов и войск в нужные регионы."
 AAW_USA_war_propaganda:0 "Военная пропаганда"
 AAW_USA_war_propaganda_desc:0 "Наш народ не хочет отправлять детей на смерть в очередной войне, но многие политики видят необходимость вмешательства. Пропаганда, демонизирующая врага и призывающая к войне, - не только инструмент тиранов."
 AAW_USA_war_plan_black:0 "План войны «Чёрный»"
 AAW_USA_war_plan_black_desc:0 "Очевидно, что политика и экспансионизм Германии вышли за границы разумного. Их нужно остановить, пока их военная машина не достигла точки невозврата."
 AAW_USA_embargo_germany:0 "Эмбарго против Германии"
 AAW_USA_embargo_germany_desc:0 "Германия зависит от нефти и других ресурсов для своей войны. Лишить их доступа к этому - минимум, что мы можем сделать."
 AAW_USA_destroyers_for_bases:0 "Сделка «Эсминцы за базы»"
 AAW_USA_destroyers_for_bases_desc:0 "Британии нужны корабли, а нам - защита своей территории. В обмен на право размещения военных баз на британских территориях мы можем передать несколько эсминцев, которые, надеемся, пригодятся."
 AAW_USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 AAW_USA_war_plan_white:0 "План войны «Белый»"
 AAW_USA_war_plan_white_desc:1 "Нельзя позволить [GetSovietThreatName] бесконтрольно расширяться. Нет большей угрозы для нашей нации и всего мира, чем эта - как извне, так и изнутри."
 AAW_USA_embargo_USSR:0 "Эмбарго против СССР"
 AAW_USA_embargo_USSR_desc:0 "Лишив Советский Союз торговых возможностей с нами, мы не только прекратим помощь их военным усилиям, но и докажем превосходство нашей экономической модели."
 AAW_USA_war_plan_red:0 "План войны «Красный»"
 AAW_USA_war_plan_red_desc:0 "Казалось, Британская империя встала на путь уважения к народам, но теперь она противостоит ветрам перемен, которые мы приняли. Они показывают своё истинное лицо. Мы должны дать им понять, где наша позиция."
 AAW_USA_embargo_the_empire:0 "Эмбарго против Империи"
 AAW_USA_embargo_the_empire_desc:0 "Несмотря на долгие годы хороших отношений, британцы предали идеалы, которым, как мы надеялись, они научились следовать. Пора показать им последствия."
 AAW_USA_war_plan_orange:0 "План войны «Оранжевый»"
 AAW_USA_war_plan_orange_desc:0 "Нет большей угрозы для нас, чем империалистические амбиции Японии. Их экспансия в Азию и Тихий океан быстро приведёт к конфликту с нашими интересами."
 AAW_USA_embargo_japan:0 "Эмбарго против Японии"
 AAW_USA_embargo_japan_desc:0 "Мы должны показать Японии, что их агрессия не будет принята или поддержана США. Эмбарго станет первым шагом к срыву их планов в Тихом океане."
 AAW_USA_prepare_intervention:0 "Подготовка к вмешательству"
 AAW_USA_prepare_intervention_desc:0 "Благодаря дипломатическим и торговым решениям наша позиция на международной арене изменилась с нейтральной и изоляционистской на активное противодействие иностранной агрессии. Наша военная политика будет отражать это в будущем."
 AAW_USA_extra_tech_team:0 "Дополнительная техническая команда"
 AAW_USA_manhattan_project:0 "Манхэттенский проект"
 AAW_USA_manhattan_project_desc:0 "«Разработка заменителей материалов» - безобидно звучащий проект Инженерного корпуса, который впоследствии станет известен как Манхэттенский проект. Одна из самых секретных и опасных операций в военной истории, его цель - создание первой атомной бомбы."
 AAW_USA_unholy_alliance:0 "Союз с Советами"
 AAW_USA_unholy_alliance_desc:0 "Иногда нам приходится выбирать врагов. Часто выбор нелёгок. Будущее может осудить нас за то, что мы встали рядом с одним тираном, или восхвалить за спасение от другого."
 AAW_USA_unholy_alliance_tt:1 "Улучшает мнение и торговые отношения с [SOV.GetNameDef] или Германией, если они в состоянии войны, встав на сторону защищающегося."
 AAW_USA_limited_intervention:0 "Ограниченное вмешательство"
 AAW_USA_limited_intervention_desc:0 "Потребуется чрезвычайная агрессия, чтобы втянуть нас в войну в полную силу, но после последних событий многие люди готовы добровольно помогать в конфликтах за рубежом."
 AAW_USA_the_giant_wakes:0 "Пробуждение гиганта"
 AAW_USA_the_giant_wakes_desc:0 "Нации обращаются к нам за защитой ценностей демократии и свободы. Мир, в котором родилась невмешательская Америка, больше не существует, и мы должны адаптироваться."
 AAW_USA_pearl_harbor_gambit:0 "Гавайская авантюра"
 AAW_USA_pearl_harbor_gambit_desc:0 "Военно-морская база в Перл-Харборе - лёгкая цель для японцев. Разместив там флот, мы продемонстрируем нашу мощь в Тихом океане. Осмелятся ли они бросить вызов такому смелому шагу?"
 AAW_USA_pearl_harbor_gambit_tt:0 "§YПока фокус активен, у Японии будет возможность атаковать.§!"
 AAW_USA_cancel_pearl_harbor_gambit:0 "Отменить Гавайскую авантюру"
 AAW_USA_cancel_pearl_harbor_gambit_desc:0 "Размещение флота в Перл-Харборе подвергает опасности жизни наших моряков. Мы не будем рисковать ими, чтобы спровоцировать войну с Японией."
 AAW_USA_air_war_plans_division:0 "Отдел планирования воздушной войны"
 AAW_USA_air_war_plans_division_desc:0 "Для правильного определения приоритетов в авиации и производстве самолётов требуется долгосрочное планирование. AWPD обеспечит нас материалами, организацией и стратегическими планами."
 AAW_USA_air_support:0 "План поддержки с воздуха"
 AAW_USA_air_support_desc:0 "Воздушная война должна в первую очередь использоваться совместно с другими военными операциями."
 AAW_USA_strategic_bombing:0 "План стратегических бомбардировок"
 AAW_USA_strategic_bombing_desc:0 "Возможность точных бомбардировок позволит нам остановить военную машину любой страны."
 AAW_USA_TAC:0 "Исследование тактических бомбардировщиков"
 AAW_USA_TAC_desc:0 "Создание самолётов для атаки тактических целей позволит нашим войскам продвигаться безопаснее."
 AAW_USA_combined_bomber_offensive:0 "Совместная бомбардировочная операция"
 AAW_USA_combined_bomber_offensive_desc:0 "Имея на своей стороне ещё одну великую державу, мы получаем неожиданные преимущества в исследовании и проведении масштабных бомбардировочных операций."
 AAW_USA_fund_the_navy:0 "Финансирование флота"
 AAW_USA_fund_the_navy_desc:0 "Мы должны быть готовы ко всему новому, что бросит нам враг. Увеличение финансирования военно-морских учений приведёт к созданию более эффективного флота, способного тактически превзойти противника."
 AAW_USA_bureau_of_ships:0 "Бюро кораблестроения"
 AAW_USA_bureau_of_ships_desc:1 "Мы объединим Бюро строительства и ремонта с Бюро инженерного дела в одну организацию для контроля за будущим развитием флота. Пока мы этим заняты, возможно, стоит проверить слухи о неэффективности торпед, которые Бюро вооружений так яростно отрицает."
 AAW_USA_battleship_primacy:0 "Примат линкоров"
 AAW_USA_battleship_primacy_desc:0 "После денонсации Японией Вашингтонского морского договора мы можем столкнуться с новой гонкой вооружений на океанах. Мы обеспечим себе превосходство в количестве и качестве линкоров."
 AAW_USA_advanced_mahanian_doctrine:0 "Продвинутая доктрина Мэхэна"
 AAW_USA_advanced_mahanian_doctrine_desc:0 "Влияние Альфреда Тайера Мэхэна на военно-морскую стратегию трудно переоценить. Развивая его идеи, мы сможем эффективно использовать линкоры, которые он считал решающим фактором."
 AAW_USA_carrier_primacy:0 "Примат авианосцев"
 AAW_USA_carrier_primacy_desc:0 "В предстоящих сражениях потребуется воздушная мощь, и наиболее практичным способом её применения являются авианосцы. Мы должны создать более совершенные и специализированные модели."
 AAW_USA_bureau_of_aeronautics:0 "Бюро аэронавтики"
 AAW_USA_bureau_of_aeronautics_desc:0 "Для удовлетворения потребностей развития морской авиации необходимо расширить Бюро аэронавтики, которое десятилетиями занималось этими вопросами."
 AAW_USA_escort_effort:0 "Противолодочные усилия"
 AAW_USA_escort_effort_desc:0 "Подводные лодки представляют опасность для наших торговых конвоев. Разработка новых моделей эсминцев позволит нам эффективно вести противолодочную войну."
 AAW_USA_convoy_tactics:0 "Тактика конвоев"
 AAW_USA_convoy_tactics_desc:0 "Защита торговых судов зависит не только от эскортов и разведки, но и от тактических решений по организации торговых маршрутов."
 AAW_USA_amphibious_operations:0 "Амфибийные операции"
 AAW_USA_amphibious_operations_desc:0 "Если только наши худшие кошмары не сбудутся, эта война не закончится на американской земле. Хорошо спланированные десантные операции станут частью пути к победе."
 AAW_USA_expand_the_USMC:0 "Расширение корпуса морской пехоты США"
 AAW_USA_expand_the_USMC_desc:0 "Корпус морской пехоты США был решающей силой во многих прошлых войнах и может стать ещё более важным для наших амфибийных кампаний. Semper fidelis!"
 AAW_USA_reinforce_monroe_doctrine:0 "Укрепление доктрины Монро"
 AAW_USA_reinforce_monroe_doctrine_desc:0 "Доктрине Монро, закрепившей вмешательство США в случае европейских попыток колонизации Америк, более 100 лет. Усиление нашей роли миротворцев на этих континентах повысит наше влияние в регионе."
 AAW_USA_carribean_sphere:0 "Карибская сфера"
 AAW_USA_carribean_sphere_desc:0 "Карибские острова - идеальное место для ударов по нашему восточному побережью или Панамскому каналу, поэтому мы должны ясно дать понять, что враждебные захваты в этом регионе недопустимы."
 AAW_USA_central_america:0 "Центральная Америка"
 AAW_USA_central_america_desc:0 "Немыслимо позволить любой иностранной державе захватить или даже угрожать Панамскому каналу. Поэтому мы гарантируем независимость всех центральноамериканских стран."
 AAW_USA_the_neighbors:0 "Соседи"
 AAW_USA_the_neighbors_desc:0 "В первую очередь мы должны обеспечить безопасность ближайших к нам стран. Вместо того чтобы позволить врагу пройти через наших соседей к нам, мы сделаем так, что они пройдут через нас, если попытаются пересечь наших соседей."
 AAW_USA_south_america:0 "Южная Америка"
 AAW_USA_south_america_desc:0 "Колониальные империи никогда больше не должны расширяться в Южную Америку. Мы гарантируем независимость наших южных братьев, чтобы защитить их."
 AAW_USA_pax_americana:0 "Pax Americana"
 AAW_USA_pax_americana_desc:0 "Мир в Америке должен быть сохранён. У нас есть силы, чтобы мелкие распри между соседними странами не перерастали в конфликты. Война у нашего порога - именно то, чего хотят наши враги, и мы должны сделать всё, чтобы предотвратить это."
 AAW_USA_pax_americana_tt:0 "@USA §YСША§! могут вмешиваться в войны между американскими странами"
 AAW_USA_black_chamber:0 "Операции «Чёрной палаты»"
 AAW_USA_black_chamber_complete:0 "§RСОВЕРШЕННО СЕКРЕТНО§!"
 AAW_USA_black_chamber_desc:0 "У нас есть информация о политической деятельности в ряде американских стран, которая не соответствует нашим интересам. К счастью, мы создали подпольную пропагандистскую сеть и готовы направить эти страны в нужное нам русло. Это необходимо для обеспечения нашей безопасности дома."
 AAW_USA_preemptive_intervention:0 "Упреждающее вмешательство"
 AAW_USA_preemptive_intervention_desc:0 "Мы больше не можем бездействовать, наблюдая, как соседние страны создают орудия войны для подавления нас или наших союзников. Мы должны вмешаться ради блага нашей великой страны и всего мира."
 AAW_USA_reinforce_monroe_doctrine_tt:0 "Улучшает торговое мнение всех американских стран.\n"
 AAW_USA_civil_war_fired:0 "Началась Вторая гражданская война в США."
 AAW_USA_anti_imperialism:0 "Антиимпериализм"
 AAW_USA_anti_imperialism_desc:0 "Америка всегда была врагом империалистических угнетателей, но очевидно, что большинство так называемых демократий готовы сохранять эти институты, пока извлекают выгоду. Революционеры Советского Союза - лучшие союзники."
 AAW_USA_fascist_menace:1 "Прусская угроза"
 AAW_USA_fascist_menace_desc:1 "Версальский договор и экономические санкции не остановили Германию, и прусский милитаризм вновь поднимает свою уродливую, агрессивную голову. Германию нужно снова победить и взять под контроль, хотя бы на время."
 AAW_USA_crusade_against_communism:0 "Крестовый поход против коммунизма"
 AAW_USA_crusade_against_communism_desc:0 "Красный террор - худшая угроза, с которой когда-либо сталкивался мир. Любыми средствами необходимо уничтожить разрушительную идеологию, исходящую из Советского Союза, и мы сделаем это."
 AAW_USA_strike_at_the_empire:0 "Удар по Империи"
 AAW_USA_strike_at_the_empire_desc:0 "Главная угроза свободе в мире - колониальные империи европейских сверхдержав. Их нужно уничтожить, а их народы освободить, начиная с Британской империи, от которой мы сами когда-то освободились."
 AAW_USA_defense_of_the_pacific:0 "Защита Тихого океана"
 AAW_USA_defense_of_the_pacific_desc:0 "Японское правительство безнадёжно, его экспансионизм угрожает как нашим людям, так и азиатским соседям. Страну необходимо поставить под американское управление, чтобы реформировать её и предотвратить повторение ошибок."
 AAW_USA_continue_the_new_deal:1 "Продолжение Нового курса"
 AAW_USA_continue_the_new_deal_desc:1 "Политика Нового курса доказала свою эффективность. Мы не должны сбиваться с пути сейчас."
 AAW_USA_suspend_the_presecution:0 "Прекращение преследований"
 AAW_USA_suspend_the_presecution_desc:0 "Преследование американских граждан за их политические взгляды - какими бы отвратительными они ни казались - противоречит ценностям нашей страны. Это должно немедленно прекратиться."
 AAW_USA_desegregate_the_armed_forces:1 "Десегрегация вооружённых сил"
 AAW_USA_desegregate_the_armed_forces_desc:1 "Служба в вооружённых силах своей страны может быть нежеланной обязанностью, но также и дорогим правом. Право, в котором многим нашим гражданам отказывают из-за их происхождения."
 AAW_USA_full_desegregation:1 "Полная десегрегация"
 AAW_USA_full_desegregation_desc:1 "Слишком долго некоторые наши штаты относились к людям по-разному, основываясь на старых, устаревших и бесчеловечных критериях. В свободной республике каждый гражданин должен быть равным, а не отдельным."
 AAW_USA_democratic_socialism:1 "Демократический социализм"
 AAW_USA_democratic_socialism_desc:1 "Ни один здравомыслящий человек не станет отрицать, что социализм - будущее человеческой цивилизации. В то же время ни один патриот этой республики не поддержит систему, где правительство больше не создаётся народом и для народа. Как наши славные предки, мы создадим новую форму правления, сочетающую оба принципа."
 AAW_USA_liberty_for_the_philippines:1 "Свобода Филиппинам"
 AAW_USA_liberty_for_the_philippines_desc:1 "Народ Филиппин показал свою способность организовывать свою жизнь, и пришло время окончательно устранить последние следы американского контроля над их страной."
 AAW_USA_pacific_decolonisation:1 "Деколонизация Тихого океана"
 AAW_USA_pacific_decolonisation_desc:1 "Нет никакого оправдания - ни одного - продолжающемуся присутствию европейских держав в Тихом океане и содержанию народов тихоокеанских островов в подчинении у их европейских хозяев. Америка больше не будет бездействовать, пока продолжается эта несправедливость."
 AAW_USA_union_representation_act:1 "Акт о представительстве профсоюзов"
 AAW_USA_union_representation_act_desc:1 "Труд - основная часть человеческой жизни, а объединение в профсоюзы - фундаментальная часть демократического общества. Мы должны признать это и обеспечить обязательное представительство профсоюзов в Конгрессе."
 AAW_USA_old_age_pension_act:1 "Акт о пенсиях по старости"
 AAW_USA_old_age_pension_act_desc:1 "После жизни, полной труда, наши люди заслуживают финансовой безопасности и уважения в старости. Существующее законодательство явно недостаточно для их поддержки."
 AAW_USA_accumulated_wealth_tax_act:1 "Акт о налоге на накопленное богатство"
 AAW_USA_accumulated_wealth_tax_act_desc:1 "Некоторые люди в нашей стране накопили абсурдные суммы капитала. Эти деньги лежат без дела на банковских счетах или вложены в непрактично большие здания, позолоченную мебель и дорогие картины. Всё это не имеет экономического смысла. Новый налог заставит граждан, накопивших такое бесполезное богатство, реинвестировать деньги в экономику."
 AAW_USA_guarantee_the_american_dream:1 "Гарантия американской мечты"
 AAW_USA_guarantee_the_american_dream_desc:0 "Большинство наших людей хотят немногого: стабильной работы, хорошего здоровья и места, где можно создать семью. Нет причин, почему они не должны этого иметь."
 AAW_USA_worker_management_act:1 "Акт о рабочем управлении"
 AAW_USA_worker_management_act_desc:1 "Слишком часто фабриками и офисами управляют люди, никогда не работавшие на производстве. Не понимая реальностей, они ставят невыполнимые задачи. Чтобы защитить экономику от таких некомпетентных менеджеров, мы внедрим управление рабочих, рабочими и для рабочих!"
 AAW_USA_militia_organization_act:1 "Акт об организации милиции"
 AAW_USA_militia_organization_act_desc:1 "Наша гордая республика имеет долгую традицию гражданских солдат. Если нашу страну когда-либо вторгнется враг, он столкнётся с хорошо организованной и вооружённой милицией мужчин и женщин, сражающихся на знакомой территории за свои дома."
 AAW_USA_communal_property_act:1 "Акт об общинной собственности"
 AAW_USA_communal_property_act_desc:1 "Потребности многих не должны перевешиваться желаниями немногих или даже одного. Чтобы обеспечить это, мы примем новый закон, упрощающий местным общинам процедуру принудительного выкупа."
 AAW_USA_reintegration:1 "Реинтеграция"
 AAW_USA_reintegration_desc:1 "Война разделила нашу нацию, но даже те, кто восстал против нас, могут быть искуплены. Когда население осознает свои ошибки, ему следует позволить вновь участвовать в политическом процессе нашей гордой республики."
 AAW_USA_reach_out_to_the_ware_group:1 "Обращение к группе Уэйра"
 AAW_USA_reach_out_to_the_ware_group_desc:1 "В нашем правительстве существует небольшая группа преданных коммунистов. Они думают, что действуют тайно, но мы знаем их имена. Возможно, они увидят, что наши цели совпадают, и согласятся присоединиться к правительству."
 AAW_USA_us_ussr_economic_cooperation:1 "Экономическое сотрудничество США-СССР"
 AAW_USA_us_ussr_economic_cooperation_desc:1 "Несмотря на хаотичное и кровавое рождение, Советский Союз достиг remarkable прогресса в построении современного индустриального общества. Мы должны внести свой вклад в помощь им."
 AAW_USA_secure_china:1 "Защита Китая"
 AAW_USA_secure_china_desc:1 "Китай охвачен долгой кровавой гражданской войной. Националистическое правительство глубоко коррумпировано и потеряло всякую поддержку населения. Пришло время поддержать единственную силу в Китае, способную объединить и стабилизировать страну - Коммунистическую партию."
 AAW_USA_end_monarchism:1 "Покончить с монархизмом"
 AAW_USA_end_monarchism_desc:1 "Монархии Европы уже однажды ввергли мир в мировую войну - мы не можем позволить им сделать это снова. Наши предки воевали с королём Англии за свою свободу - мы навсегда освободим мир от его тирании!"
 AAW_USA_shatter_the_empires:1 "Разрушить империи"
 AAW_USA_shatter_the_empires_desc:1 "Мы сами были колонией глобальной империи, пока не купили свою свободу кровью. Наша республика не может чувствовать себя в безопасности, пока те, кто мнит себя хозяевами мира, не будут остановлены."
 AAW_USA_agricultural_adjustment_act:1 "Закон о регулировании сельского хозяйства"
 AAW_USA_agricultural_adjustment_act_desc:1 "Наши фермеры особенно сильно пострадали от депрессии. Мы должны обеспечить, чтобы люди, производящие нашу еду, не разорялись из-за неконтролируемого рынка."
 AAW_USA_fair_labour_standards_act:1 "Закон о справедливых трудовых стандартах"
 AAW_USA_fair_labour_standards_act_desc:1 "С первыми признаками медленного восстановления пришло время обеспечить участие рабочих в этом процессе. Мы должны запретить эксплуататорские практики вроде неоплачиваемых сверхурочных и ввести прожиточный минимум."
 AAW_USA_federal_housing_act:1 "Федеральный жилищный закон"
 AAW_USA_federal_housing_act_desc:1 "В рамках нашей программы по искоренению бедности в США мы создадим программу федерального субсидирования жилья."
 AAW_USA_office_of_scientific_research_and_development:1 "Управление научных исследований и разработок"
 AAW_USA_office_of_scientific_research_and_development_desc:1 "С приближением войны мы должны сосредоточить научные усилия, чтобы не уступить никакому потенциальному противнику."
 AAW_USA_focus_on_europe:1 "Подготовка к Европе"
 AAW_USA_focus_on_europe_desc:1 "Великие державы Европы вновь готовы ввергнуть мир в мировую войну. Мы не можем, как прежде, ждать, пока это затронет нас. Мы должны быть готовы вмешаться решительно, если какая-либо европейская страна угрожает миру."
 AAW_USA_focus_on_asia:1 "Подготовка к Азии"
 AAW_USA_focus_on_asia_desc:1 "Пока большинство с тревогой смотрят на Европу, мы также сталкиваемся с нестабильностью в Тихом океане. Возможно, в наших интересах вмешаться за рубежом, прежде чем нас атакуют ближе к дому."
 AAW_USA_magic:1 "MAGIC"
 AAW_USA_magic_desc:1 "Флот считает, что может взломать японские шифры, что позволит нам читать все их сообщения, включая перемещения кораблей."
 AAW_USA_neutrality_act:1 "Акт о нейтралитете"
 AAW_USA_neutrality_act_desc:1 "Всё более очевидно, что в Европе начнётся война. Во время Великой войны американские компании продавали союзникам большое количество оружия, и многие считают, что вступление США было мотивировано желанием обеспечить оплату этих поставок. На этот раз военного profiteering не будет."
 AAW_USA_lend_lease_act_neutrality_tt:0 "\n\nПринятие Акта о нейтралитете §Rзначительно усложнит§! принятие Закона о ленд-лизе"
 AAW_USA_lend_lease_act:1 "Закон о ленд-лизе"
 AAW_USA_lend_lease_act_desc:1 "Крупные демократии мира подвергаются нападению. Если они проиграют, вопрос лишь во времени, когда война придёт к нашим берегам. Мы должны поддержать их, даже если они не смогут сразу оплатить поставки."
 AAW_USA_reestablish_the_gold_standard:1 "Восстановить золотой стандарт"
 AAW_USA_reestablish_the_gold_standard_desc:1 "Без золотого стандарта деньги существуют лишь как предмет веры, а безудержная инфляция уничтожает сбережения наших людей и обесценивает их труд. Мы должны отказаться от этой финансово безответственной политики."
 AAW_USA_adjusted_compensation_act:1 "Закон о корректировке компенсаций"
 AAW_USA_adjusted_compensation_act_desc:1 "Нашим ветеранам Великой войны обещали достойную пенсию. Многие оказались в тяжёлом положении во время депрессии. Мы должны помочь тем, кто откликнулся на зов Республики в час нужды."
 AAW_USA_labour_management_relations_act:1 "Закон о трудовых отношениях"
 AAW_USA_labour_management_relations_act_desc:1 "Бизнес по всей Америке страдает от профсоюзной активности - забастовок, организации, требований повышения зарплат. Мы не можем позволить этому продолжаться."
 AAW_USA_protectionist_tariffs:1 "Протекционистские тарифы"
 AAW_USA_protectionist_tariffs_desc:1 "Свободная торговля открыла наши рынки для иностранных конкурентов, многие из которых ввели собственные пошлины. Наши компании сталкиваются с жёсткой конкуренцией, в то время как их защищают таможенные барьеры. Этому должен быть положен конец."
 AAW_USA_income_tax_reform:2 "Реформа подоходного налога"
 AAW_USA_income_tax_reform_desc:1 "Подоходный налог забирает деньги из карманов каждого американца - деньги, которые наши граждане могли бы потратить на покупки и поддержку местной экономики. Мы вернём американцам контроль над их финансами."
 AAW_USA_institute_of_american_sciences:1 "Американский институт наук"
 AAW_USA_institute_of_american_sciences_desc:1 "Университеты и исследовательские центры по всей стране до сих пор проводили исследования по своему усмотрению. Этому должен быть положен конец. Мы создадим новую организацию для координации усилий наших учёных мирового класса."
 AAW_USA_america_first:0 "Америка прежде всего"
 AAW_USA_america_first_desc:2 "Некоторые хотят, чтобы мы тратили наши богатства и кровь нашей молодёжи на зарубежные войны. Мы не должны поддаваться на уговоры этих поджигателей войны и будем руководствоваться простым принципом: Америка прежде всего - все остальные вторые."
 AAW_USA_extend_the_chinese_exclusion_acts:1 "Продлить китайские исключительные законы"
 AAW_USA_extend_the_chinese_exclusion_acts_desc:2 "С Китаем, разорённым войной, мы должны ограничить китайскую иммиграцию, чтобы не быть затопленными волнами беженцев."
 AAW_USA_empower_the_huac:1 "Усилить Комитет по антиамериканской деятельности"
 AAW_USA_empower_the_huac_desc:1 "Комитет Палаты представителей по антиамериканской деятельности играет важную роль в нашей здоровой демократии. Мы не должны позволять нелояльным элементам влиять на политический процесс."
 AAW_USA_voter_registration_act:1 "Закон о регистрации избирателей"
 AAW_USA_voter_registration_act_desc:1 "Выборы - важнейшая часть демократии. Совершенно неразумно требовать отсутствия проверок для участия в них - возможно, те, кто выступает за неконтролируемые выборы, имеют зловещие мотивы и хотят подорвать процесс фальсификациями..."
 AAW_USA_ally_with_the_silver_shirts:1 "Американский фашизм"
 AAW_USA_ally_with_the_silver_shirts_desc:1 "Чтобы вернуть нашей нации подобающее место в мире и исполнить наше предначертание, необходима более фундаментальная реорганизация. «Серебряные рубашки» помогут нам в этом."
 AAW_USA_ally_with_the_silver_shirts_tt:1 "Выбрать лидера для новой Америки"
 AAW_USA_national_prosperity_program:1 "Национальная программа процветания"
 AAW_USA_national_prosperity_program_desc:1 "Ключ к быстрому восстановлению и устойчивому процветанию лежит не в неконтролируемых рынках, а в тщательно спланированных программах, соединяющих частные и государственные предприятия."
 AAW_USA_privatize_the_TVA:1 "Приватизировать Управление долины Теннесси"
 AAW_USA_privatize_the_TVA_desc:1 "Управление долины Теннесси вытеснило частных конкурентов и установило монополию на строительные работы в регионе. Не дело правительства делать то, что частный сектор делает лучше."
 AAW_USA_de_regulate_the_banking_sector:1 "Дерегулировать банковский сектор"
 AAW_USA_de_regulate_the_banking_sector_desc:1 "После коррекции на финансовых рынках, что совершенно нормально в экономическом цикле, предыдущие правительства ввели неразумные ограничения на финансовую деятельность. Хотя и с благими намерениями, эти ограничения приносят больше вреда, чем пользы."
 AAW_USA_national_employment_strategy:1 "Национальная стратегия занятости"
 AAW_USA_national_employment_strategy_desc:1 "Безработица возникает из-за простого факта: люди не соответствуют предлагаемым рабочим местам. Фабрики простаивают, потому что работодатели не находят нужных людей, в то время как в других частях страны люди голодают. Мы внедрим стратегию, которая обеспечит работодателей необходимыми кадрами."
 AAW_USA_invite_foreign_support:1 "Пригласить иностранную поддержку"
 AAW_USA_invite_foreign_support_desc:1 "С тревожными сообщениями о лояльности военных и некоторых правительств штатов, нам, возможно, придётся искать поддержку за рубежом."
 AAW_USA_send_lindbergh_to_germany:1 "Отправить Линдберга в Германию"
 AAW_USA_send_lindbergh_to_germany_desc:1 "Знаменитый лётчик предложил поехать в Европу, чтобы изучить, как Германия восстановилась после войны. Это даст нам ценный опыт. Линдберг также выразил готовность войти в правительство в качестве консультанта."
 AAW_USA_work_with_the_bund:1 "Работа с Бундом"
 AAW_USA_work_with_the_bund_desc:1 "Немецко-американский Бунд предложил помочь нам донести наши позиции до многих американцев немецкого происхождения. Это обеспечит нам поддержку в их штатах."
 AAW_USA_work_with_the_bund_tt:0 "Гарантирует, что следующие штаты останутся с правительством в случае гражданской войны: Огайо, Миссури, Висконсин, Иллинойс, Индиана и Мичиган"
 AAW_USA_recruit_the_free_corps:1 "Формализовать Добровольческий корпус"
 AAW_USA_recruit_the_free_corps_desc:1 "Добровольческий корпус - военизированное крыло нашей организации. Теперь, когда мы у власти, следует сделать его официальной структурой в правительстве."
 AAW_USA_honor_the_confederacy:1 "Почтить Конфедерацию"
 AAW_USA_honor_the_confederacy_desc:1 "Слишком долго историю Гражданской войны рассказывали с северной точки зрения - как историю обречённого мятежа. Пора услышать и другую сторону."
 AAW_USA_war_powers_act:1 "Закон о военных полномочиях"
 AAW_USA_war_powers_act_desc:1 "В мире, где самолёты становятся всё быстрее и несут всё больше бомб, где есть подлодки и химическое оружие, ограничение президента необходимостью согласия Конгресса на действия по защите страны - это приглашение к катастрофе."
 AAW_USA_seize_cuba:1 "Захватить Кубу"
 AAW_USA_seize_cuba_desc:1 "У наших берегов находится непотопляемый авианосец, готовый стать базой для агрессора. Мы не можем этого допустить."
 AAW_USA_eliminate_the_southern_threat:1 "Устранить южную угрозу"
 AAW_USA_eliminate_the_southern_threat_desc:1 "Мексика уже поколение представляет собой нестабильный хаос. Независимо от того, перекинется ли насилие через нашу границу или кто-то объединит страну и двинется на север - мы должны обезопасить наш южный фланг."
 AAW_USA_the_canadian_corridor:1 "Канадский коридор"
 AAW_USA_the_canadian_corridor_desc:1 "Узкая полоса малонаселённой канадской территории отделяет Аляску от основной части США. Её защита зависит от доброй воли Канады. Однако самый вероятный агрессор - это сама Канада. Так продолжаться не может."
 AAW_USA_north_american_dominion:1 "Господство в Северной Америке"
 AAW_USA_north_american_dominion_desc:1 "Обезопасив ближайшие границы, мы должны присмотреться дальше, чтобы предотвратить любые угрозы Северной Америке. Мы не потерпим неконтролируемых государств в регионе."
 AAW_USA_strategic_interests:1 "Стратегические интересы"
 AAW_USA_strategic_interests_desc:1 "Мир как никогда взаимосвязан. Угроза в одной его части может легко вырасти до опасности для всего мира. Мы должны создать глобальную сеть взаимосвязанных баз для быстрого реагирования на любые ситуации."
 AAW_USA_protect_south_america:1 "Защитить Южную Америку"
 AAW_USA_protect_south_america_desc:1 "Южная часть нашего континента была игровой площадкой империй со времён её открытия. Пора взять на себя ответственность за защиту этих наций и направление их к более продуктивному будущему."
 AAW_USA_pacific_pacification:1 "Умиротворение Тихого океана"
 AAW_USA_pacific_pacification_desc:1 "Австралия и Новая Зеландия слишком далеки от Британии для эффективной защиты. Мы не можем позволить их захват враждебной [USA.GetNameDef] нацией."
 AAW_USA_secure_asia:1 "Обезопасить Азию"
 AAW_USA_secure_asia_desc:1 "Колониальные державы Европы не желают или не способны защищать свои азиатские колонии. Мы должны взять эту ношу на себя, чтобы эти регионы не стали плацдармами для дальнейшей агрессии."
 AAW_USA_global_hegemony:1 "Глобальная гегемония"
 AAW_USA_global_hegemony_desc:1 "Мы на пороге достижения глобального превосходства, которое позволит нам предотвращать конфликты самим фактом своего существования. Нам лишь нужно, чтобы оставшиеся великие державы признали наше положение."
 AAW_USA_war_plans_division:1 "Реформа отдела военного планирования"
 AAW_USA_war_plans_division_desc:1 "Хотя мы стремимся к миру, мы должны готовиться к войне. С учётом уроков манёвров в Луизиане, мы модернизируем военные планы, разработанные в 1920-30-х годах."
 AAW_USA_intervention_in_the_americas:1 "Вмешательство в Америках"
 AAW_USA_intervention_in_the_americas_desc:1 "Наш первый приоритет - быть готовыми к любым событиям в нашем полушарии."
 AAW_USA_war_plan_green:1 "План войны «Зелёный»"
 AAW_USA_war_plan_green_desc:1 "С постоянной нестабильностью в Мексике после революции, мы должны быть готовы к решительному вмешательству."
 AAW_USA_war_plan_crimson:1 "План войны «Малиновый»"
 AAW_USA_war_plan_crimson_desc:1 "Хотя Канада сейчас дружественный сосед, так может быть не всегда."
 AAW_USA_war_plan_gray:1 "План войны «Серый»"
 AAW_USA_war_plan_gray_desc:1 "История показала, что страны Карибского бассейна весьма нестабильны. Нам, возможно, придётся быстро действовать для защиты американских интересов."
 AAW_USA_hemisphere_defense:1 "Защита полушария"
 AAW_USA_hemisphere_defense_desc:1 "Независимо от зарубежных обязательств, мы должны в первую очередь заботиться о своём регионе."
 AAW_USA_intervention_in_europe:1 "Вмешательство в Европе"
 AAW_USA_intervention_in_europe_desc:1 "Менее чем через два десятилетия после Великой войны, европейские нации вновь готовы к войне. Мы должны быть готовы к решительному вмешательству, если ситуация потребует."
 AAW_USA_war_plan_gold:1 "План войны «Золотой»"
 AAW_USA_war_plan_gold_desc:1 "Франция страдает от внутренних раздоров и радикализации, оставаясь одной из сильнейших военных держав Европы. Это сочетание вызывает беспокойство."
 AAW_USA_war_plan_silver:0 "План войны «Серебряный»"
 AAW_USA_war_plan_silver_desc:0 "Италия открыто заявила о своих амбициях править Средиземноморьем. Если их имперские желания столкнутся с нашими интересами, мы должны быть готовы."
 AAW_USA_anti_bolshevist_aid:2 "Помощь против [GetSovietThreatNameAlt]"
 AAW_USA_anti_bolshevist_aid_desc:2 "Каждое оружие, снаряд, патрон и пара сапог, которые мы дадим борцам с [GetSovietThreatNameAlt], в конечном итоге помогут защитить нас."
 AAW_USA_war_plan_ruby:1 "План войны «Рубиновый»"
 AAW_USA_war_plan_ruby_desc:1 "Индия населена миллионами людей, с которыми мы должны быть готовы столкнуться в случае конфликта."
 AAW_USA_war_plan_scarlet_garnet:1 "План войны «Алый гранат»"
 AAW_USA_war_plan_scarlet_garnet_desc:1 "В Тихом океане Австралия и Новая Зеландия могут прийти на помощь метрополии. Любой план против Британии должен учитывать её колонии."
 AAW_USA_intervention_in_asia:1 "Вмешательство в Азии"
 AAW_USA_intervention_in_asia_desc:1 "На фоне событий в Европе азиатские проблемы часто остаются в тени, но мы должны быть готовы к возможному вмешательству."
 AAW_USA_war_plan_yellow:1 "План войны «Жёлтый»"
 AAW_USA_war_plan_yellow_desc:1 "Китай уже более поколения охвачен гражданской войной. Ситуация может ухудшиться до такой степени, что нам придётся вмешаться."
 AAW_USA_war_department:1 "Реформа Военного департамента"
 AAW_USA_war_department_desc:1 "В эпоху индустриальной войны нам необходимо управление, способное максимально эффективно использовать ресурсы нашей великой нации."
 AAW_USA_selective_training_act:1 "Закон о выборочной подготовке"
 AAW_USA_selective_training_act_desc:1 "США традиционно медлили с введением призыва, даже во время войны. Теперь мы не можем себе этого позволить."
 AAW_USA_louisiana_maneuvers:1 "Луизианские манёвры"
 AAW_USA_louisiana_maneuvers_desc:1 "Бюджетные ограничения вынуждали нас наблюдать за военными разработками со стороны. Теперь мы наконец можем испытать наши теории на практике."
 AAW_USA_airborne_divisions:1 "Воздушно-десантные дивизии"
 AAW_USA_airborne_divisions_desc:1 "Увеличение дальности и грузоподъёмности самолётов открыло новые возможности. Транспортная авиация может доставить целую дивизию в глубокий тыл врага, где она сможет сеять хаос."
 AAW_USA_armed_forces_of_the_united_states:1 "Армия Соединённых Штатов"
 AAW_USA_armed_forces_of_the_united_states_desc:1 "Для предстоящих сражений американские вооружённые силы слишком малочисленны. Для управления предстоящим масштабным расширением нам потребуется создать новую организационную структуру."
 AAW_USA_womens_armed_service_integration_act:1 "Акт об интеграции женщин в вооружённые силы"
 AAW_USA_womens_armed_service_integration_act_desc:1 "Мы не можем позволить себе отказать любому, кто хочет служить. Каждая женщина в форме освобождает мужчину для борьбы на фронте."
 AAW_USA_tank_experiments:1 "Танковые эксперименты"
 AAW_USA_tank_experiments_desc:1 "Танки стали незаменимы на современном поле боя. Мы должны определить оптимальные способы их применения."
 AAW_USA_tank_destroyer_doctrine:1 "Доктрина истребителей танков"
 AAW_USA_tank_destroyer_doctrine_desc:1 "Спорная теория, разработанная артиллерийскими офицерами, утверждающая, что лучшее оружие против танковых прорывов - быстрая, легкобронированная, но мощно вооружённая машина."
 AAW_USA_main_battle_tanks:1 "Основные боевые танки"
 AAW_USA_main_battle_tanks_desc:1 "Опыт показал, что танк должен выполнять множество задач - от поддержки пехоты до борьбы с вражеской бронетехникой. Создание универсальных машин упростит производство."
 AAW_USA_armored_infantry:1 "Бронированная пехота"
 AAW_USA_armored_infantry_desc:1 "Одни танки не могут выиграть сражение. Территорию удерживает пехота. Оснастив её бронетехникой, мы обеспечим её мобильность и защиту."
 AAW_USA_build_the_pentagon:1 "Построить Пентагон"
 AAW_USA_build_the_pentagon_desc:1 "Расширение вооружённых сил требует новой глобальной штаб-квартиры для управления ими."
 AAW_USA_department_of_defense:1 "Министерство обороны"
 AAW_USA_department_of_defense_desc:1 "Переименование военного департамента подчёркивает, что мы больше не можем игнорировать защиту до момента испытаний. Бдительность должна быть постоянной."
 AAW_USA_escort_fighters:1 "Истребители сопровождения"
 AAW_USA_escort_fighters_desc:1 "Бомбардировщик может прорваться, но его ведомый - нет, если только их не прикроют свои истребители."
 AAW_USA_us_army_airforce:1 "Армейские ВВС США"
 AAW_USA_us_army_airforce_desc:1 "Главная задача военной авиации - помогать сухопутным войскам захватывать и удерживать территорию. Всё остальное второстепенно."
 AAW_USA_us_air_force:1 "Военно-воздушные силы США"
 AAW_USA_us_air_force_desc:1 "Основная цель военной авиации - побеждать в войнах. Стратегические бомбардировки всё более разрушительным оружием либо сломят волю врага к сопротивлению, либо лишат его материальной возможности сопротивляться."
 AAW_USA_two_ocean_navy_act:1 "Акт о двухокеанском флоте"
 AAW_USA_two_ocean_navy_act_desc:1 "С приближением войны мы должны гарантировать, что ни один враг не ступит на американскую землю. Наш флот должен быть способен сражаться с любым противником в обоих великих океанах, омывающих наши границы."
 AAW_USA_maritime_commission:1 "Морская комиссия"
 AAW_USA_maritime_commission_desc:1 "Хотя обыватели сосредоточены на военных кораблях, настоящие эксперты знают, что войны выигрывают скромные грузовые суда. Для увеличения тоннажа на время войны мы создадим специальный совет по координации строительства."
 AAW_USA_advanced_basing:1 "Передовые базы"
 AAW_USA_advanced_basing_desc:1 "Чем дальше от наших берегов мы сможем удерживать врага, тем лучше."
 AAW_USA_naval_radar:1 "Морской радар"
 AAW_USA_naval_radar_desc:1 "Радар открывает заманчивые возможности - лишить врага укрытия ночи и обнаруживать его даже в плохую погоду."
 AAW_USA_fleet_submarines:1 "Флотские подлодки"
 AAW_USA_fleet_submarines_desc:1 "Наши наиболее вероятные противники на море зависят от внешней торговли, уязвимой для подводных лодок. Эти субмарины должны иметь большую дальность для действий у вражеских берегов."
 AAW_USA_unrestricted_submarine_warfare:1 "Неограниченная подводная война"
 AAW_USA_unrestricted_submarine_warfare_desc:1 "История показала, что все договоры о ограничении подводной войны не стоят бумаги, на которой написаны. Мы не должны связывать себя тем, что враги всё равно проигнорируют."
 AAW_USA_great_depression_cooldown:0 "Новое законодательство всё ещё разрабатывается"
 AAW_USA_limited_intervention_tt:0 "\n\nПринятие этого закона §Rзначительно усложнит§! мобилизацию вашей экономики.\n\n"
 AAW_USA_CAS:0 "Исследование штурмовой авиации"
 AAW_USA_CAS_desc:0 "Современной армии нужна поддержка не только с земли, но и с воздуха."
 AAW_USA_army_reform:0 "Армейская реформа"
 AAW_USA_army_reform_desc:0 "Тактическая доктрина армии США почти не изменилась со времён Великой войны, в то время как другие армии эволюционировали. Нам следует модернизировать подход наших сухопутных сил."
 AAW_USA_air_reform:0 "Авиационная реформа"
 AAW_USA_air_reform_desc:0 "В Великую войну американская авиация полагалась на французские и британские техники и доктрины. Хотя мы больше не зависим от их техники, наши методы недостаточно развились. Пора это изменить!"
 AAW_USA_navy_reform:0 "Военно-морская реформа"
 AAW_USA_navy_reform_desc:0 "Флот США десятилетиями был авангардом военной мощи Америки. От "Великого белого флота" до дредноутов Великой войны - мы были на передовой морской эволюции XX века. С приближением новой войны нам следует проанализировать текущие методы, чтобы сохранить лидерство в военно-морском деле."
 AAW_USA_artillery_focus:0 "План превосходства в огневой мощи"
 AAW_USA_artillery_focus_desc:0 "Великая война доказала ключевую роль артиллерии. Один из вариантов реформы - анализ и усовершенствование тактик для современной войны."
 AAW_USA_mechanised_focus:0 "План механизированной войны"
 AAW_USA_mechanised_focus_desc:0 "Битва при Камбре навсегда изменила войну. Высокомобильные бронированные силы могут прорывать фронт и окружать врага."
 AAW_USA_planning_focus:0 "План интендантской службы"
 AAW_USA_planning_focus_desc:0 "Наполеон говорил, что армия марширует на желудке. Без надёжных линий снабжения наши армии неэффективны. Нам следует изучить организацию снабжения для максимальной эффективности."
 AAW_USA_lessons_from_the_great_war:0 "Уроки Великой войны"
 AAW_USA_lessons_from_the_great_war_desc:0 "Изучение тактик Георга Брухмюллера и Канадского экспедиционного корпуса станет первым шагом в модернизации нашей артиллерии."
 AAW_USA_artillery_field_exercises:0 "Полевые артиллерийские учения"
 AAW_USA_artillery_field_exercises_desc:0 "Новые тактики требуют не только теории, но и практики. Мы должны испытать их на учениях с боевой стрельбой."
 AAW_USA_flexible_support:0 "Гибкая поддержка"
 AAW_USA_flexible_support_desc:0 "Хотя у дивизий есть своя артиллерия, мы должны позволить ей поддерживать соседние части для максимальной эффективности."
 AAW_USA_unrelenting_barrage:0 "Непрекращающийся обстрел"
 AAW_USA_unrelenting_barrage_desc:0 "Нет лучшего способа деморализовать врага, чем непрерывный артобстрел. Мы должны освоить эту тактику."
 AAW_USA_mountain_warfare:0 "Эксперименты с горной войной"
 AAW_USA_mountain_warfare_desc:0 "Некоторые страны уже использовали горные войска. Чарльз Дол из Национального лыжного патруля предлагает создать такие части. Нам следует провести учения в горах Вашингтона."
 AAW_USA_patton_reform:0 "Внедрить реформу Паттона"
 AAW_USA_patton_reform_desc:0 "Джордж Паттон настаивает на внедрении новых тактик применения бронетехники. Нам следует прислушаться и позволить ему реализовать свою программу реформ."
 AAW_USA_louisiana_maneuvers_phase_one:0 "Луизианские манёвры. Этап I"
 AAW_USA_louisiana_maneuvers_phase_one_desc:0 "Наша армия не участвовала в конфликтах со времён Первой мировой. Следует провести масштабные учения, где генералы испытают современные тактики. Болота Луизианы идеально подходят для проверки навыков ведения войны на сложной местности."
 AAW_USA_louisiana_maneuvers_phase_two:0 "Луизианские манёвры"
 AAW_USA_louisiana_maneuvers_phase_two_desc:0 "Первый этап доказал эффективность учений. Организуем второй раунд, чтобы протестировать новые тактики и учесть ошибки."
 AAW_USA_army_modernization:0 "Модернизация армии"
 AAW_USA_army_modernization_desc:0 "Наше вооружение устарело - большинство единиц техники ещё с Великой войны. Необходимы срочные изменения для подготовки к новой войне."
 AAW_USA_logistics_board:0 "Совет по логистике обороны"
 AAW_USA_logistics_board_desc:0 "Для координации масштабных поставок создадим группу из военных и гражданских специалистов по управлению логистическими сетями."
 AAW_USA_tactics_review_board:0 "Совет по пересмотру тактики"
 AAW_USA_tactics_review_board_desc:0 "Наша тактика не менялась со времён Версаля. Соберём опытных генералов для анализа и улучшения доктрин."
 AAW_USA_expand_rotc:0 "Расширить программу подготовки офицеров запаса"
 AAW_USA_expand_rotc_desc:0 "Программа обучения офицеров в колледжах должна быть расширена на все уровни образования для подготовки будущих военных лидеров."
 AAW_USA_standardize_command_structure:0 "Стандартизация командной структуры"
 AAW_USA_standardize_command_structure_desc:0 "Наша текущая структура командования хаотична. Разработаем единую понятную доктрину для офицеров."
 AAW_USA_expand_war_colleges:0 "Расширить военные академии"
 AAW_USA_expand_war_colleges_desc:0 "Армейский военный колледж существует с 1901 года. Создадим аналоги для ВВС и флота для подготовки их лидеров."
 AAW_USA_joint_chiefs_of_staff:0 "Объединённый комитет начальников штабов"
 AAW_USA_joint_chiefs_of_staff_desc:0 "Опыт Высшего командования союзников в Первой мировой показал преимущества единого штаба. Внедрим эту методику в нашем Военном департаменте."
 AAW_USA_airbase_expansion_east:0 "Расширение авиабаз на востоке"
 AAW_USA_airbase_expansion_east_desc:0 "Текущая инфраструктура ВВС недостаточна. Расширим базы в ключевых регионах для поддержки роста авиации."
 AAW_USA_airbase_expansion_west:0 "Расширение авиабаз на западе"
 AAW_USA_airbase_expansion_west_desc:0 "Текущая инфраструктура ВВС недостаточна. Расширим базы в ключевых регионах для поддержки роста авиации."
 AAW_USA_dive_bombing_trials:0 "Испытания пикирующих бомбардировщиков"
 AAW_USA_dive_bombing_trials_desc:0 "Бомбометание с пикирования повышает точность. Протестируем эту тактику для лучшей поддержки наземных войск."
 AAW_USA_fighter:0 "Исследование истребителей"
 AAW_USA_fighter_desc:0 "Наши истребители устарели. Необходима новая платформа для сохранения господства в воздухе."
 AAW_USA_carrier_lessons:0 "Уроки флота"
 AAW_USA_carrier_lessons_desc:0 "Морская авиация - новое направление, но уже есть успехи. Внедрим рекомендации пилотов в конструкцию самолётов."
 AAW_USA_heavy_bomber_research:0 "Исследование тяжёлых бомбардировщиков"
 AAW_USA_heavy_bomber_research_desc:0 "Для разрушения вражеской промышленности нужны специализированные бомбардировщики."
 AAW_USA_flying_fortress:0 "Летающая крепость"
 AAW_USA_flying_fortress_desc:0 "Чтобы бомбардировщики достигали целей, сделаем их максимально защищёнными от истребителей и ПВО."
 AAW_USA_floating_fortress_concept:0 "Концепция плавучей крепости"
 AAW_USA_floating_fortress_concept_desc:0 "Линкоры - основа флота. Обеспечим их экипажам условия для эффективной службы."
 AAW_USA_submarine_primacy:0 "Приоритет подлодок"
 AAW_USA_submarine_primacy_desc:0 "Подлодки могут лишить врага снабжения, обеспечив наше господство в глубинах."
 AAW_USA_light_cruiser_development:0 "Развитие лёгких крейсеров"
 AAW_USA_light_cruiser_development_desc:0 "Лёгкие крейсера эффективны против авиации и эсминцев. Улучшим их конструкции."
 AAW_USA_heavy_cruiser_development:0 "Развитие тяжёлых крейсеров"
 AAW_USA_heavy_cruiser_development_desc:0 "Тяжёлые крейсера важны для патрулей и оперативных групп. Разработаем новые классы."
 AAW_USA_naval_aviation_schools:0 "Школы морской авиации"
 AAW_USA_naval_aviation_schools_desc:0 "Корабельной авиации нужны особые методы. Создадим школы для обучения морских лётчиков."
 AAW_USA_carrier_task_force_training:0 "Подготовка авианосных групп"
 AAW_USA_carrier_task_force_training_desc:0 "Авианосцы стали центрами флотов. Научимся защищать эти плавучие аэродромы."
 AAW_USA_modern_carrier_tactics:0 "Современная тактика авианосцев"
 AAW_USA_modern_carrier_tactics_desc:0 "С подготовленными пилотами и кораблями разработаем передовые методы морской войны."
 AAW_USA_modernize_the_silent_service:0 "Модернизация подводного флота"
 AAW_USA_modernize_the_silent_service_desc:0 "С развитием SONAR и противолодочной войны нам нужны новые тактики для подлодок."
 AAW_USA_finish_hoover_dam:0 "Завершить плотину Гувера"
 AAW_USA_finish_hoover_dam_desc:0 "После пяти лет строительства финальный рывок завершит этот важный для трёх штатов проект."
 AAW_USA_infrastructure_expansion:0 "План расширения инфраструктуры"
 AAW_USA_infrastructure_expansion_desc:0 "Наша транспортная сеть отстаёт. Построим систему шоссе и железных дорог для улучшения логистики."
 AAW_USA_farmer_relief_plan:0 "План помощи фермерам Пыльного котла"
 AAW_USA_farmer_relief_plan_desc:0 "Поможем фермерам Великих равнин восстановиться после экологической катастрофы."
 AAW_USA_soil_conservation_service:0 "Служба сохранения почв"
 AAW_USA_soil_conservation_service_desc:0 "Новые методы земледелия предотвратят неурожаи и повысят стабильность сельского хозяйства."
 AAW_USA_veterans_affairs_commission:0 "Комиссия по делам ветеранов"
 AAW_USA_veterans_affairs_commission_desc:0 "Поможем штатам улучшить заботу о ветеранах без расширения федеральных полномочий."
 AAW_USA_hire_veterans_initiative:0 "Программа найма ветеранов"
 AAW_USA_hire_veterans_initiative_desc:0 "Стимулируем бизнес нанимать ветеранов через налоговые льготы."
 AAW_USA_reorganize_labor_department:0 "Реорганизация Минтруда"
 AAW_USA_reorganize_labor_department_desc:0 "Перестроим департамент для эффективного разрешения трудовых конфликтов."
 AAW_USA_shut_down_new_deal_agencies:0 "Закрыть агентства Нового курса"
 AAW_USA_shut_down_new_deal_agencies_desc:0 "Чрезмерное расширение федеральных программ требует сокращения. Перенаправим средства налогоплательщиков."
 AAW_USA_90_division_gamble:0 "Ставка на 90 дивизий"
 AAW_USA_90_division_gamble_desc:0 "Сосредоточимся на меньшем числе хорошо оснащённых дивизий повышенной эффективности."
 AAW_USA_victory_program:0 "Программа Победы"
 AAW_USA_victory_program_desc:0 "Готовимся к возможному краху СССР. Для противостояния Вермахту резко увеличим промышленный выпуск."
 AAW_USA_american_democracy:0 "Американская демократия"
 AAW_USA_american_democracy_desc:0 "Наша республика - маяк свободы. Продолжим путь, заложенный Отцами-основателями."
 AAW_USA_americas_rebirth:0 "Возрождение Америки"
 AAW_USA_americas_rebirth_desc:0 "Демократическая система завела страну в тупик. Америке нужны перемены для предотвращения катастрофы!"
 AAW_USA_american_socialism:0 "Американский социализм"
 AAW_USA_american_socialism_desc:0 "Норман Томас - лучший выбор, чем сталинист Браудер, приведший революцию к упадку."
 AAW_USA_american_communism:0 "Американский коммунизм"
 AAW_USA_american_communism_desc:0 "Браудер укрепит не только рабочих, но и армию, защитив страну от капиталистов."
 AAW_USA_isolationism:0 "Изоляционизм" 
 AAW_USA_isolationism_desc:0 "«Война, которая положит конец всем войнам» явно не стала последней. Напряжённость растёт, и новая война неизбежна. Мы не должны повторять ошибку втягивания в очередную европейскую войну."
 AAW_USA_give_japanese_pacific_claims:0 "Принять японские требования"
 AAW_USA_give_japanese_pacific_claims_desc:0 "Со времён Версальского договора Япония претендует на наши территории Гуама и Уэйк в Тихом океане. Чтобы избежать войны, следует отдать им то, что первоначально обещали по Японскому мандату."  
 AAW_USA_north_american_revolution:0 "Североамериканская революция"
 AAW_USA_north_american_revolution_desc:0 "Обезопасив тыл от капиталистической угрозы, мы должны обратить взор за границу. Пусть Америка станет новым маяком Рабочей революции!"
 AAW_USA_american_revolutionary_university:0 "Американский революционный университет"  
 AAW_USA_american_revolutionary_university_desc:0 "После победы революции создадим университет для продвижения наших идеалов и технологического прогресса."  
 AAW_USA_american_ingenuity:0 "Американская изобретательность"  
 AAW_USA_american_ingenuity_desc:0 "Даже в тяжёлые времена Америка всегда выходила сильнее. Великая депрессия - лишь повод работать усерднее! Наши учёные смогут добиться многого даже при ограниченных ресурсах."
 AAW_USA_embrace_the_1934_declaration_of_principles:0 "Принять Декларацию принципов 1934 года"
 AAW_USA_embrace_the_1934_declaration_of_principles_desc:0 "Декларация 1934 года, поддержанная президентом Норманом Томасом, провозглашает: поддержка международных войн и капиталистической псевдодемократии противоречит идеалам США. Наши товарищи должны принять эти принципы."
 AAW_USA_farmer_labor_act:0 "Закон о фермерах и рабочих"  
 AAW_USA_farmer_labor_act_desc:0 "Поддерживать только один класс рабочих - антисоциалистично и антиамерикански. И фермеры, и заводские рабочие должны достичь Американской мечты!"
 AAW_USA_government_decentralization:0 "Федеральная децентрализация"
 AAW_USA_government_decentralization_desc:0 "Мы отвергаем сталинскую идеологию централизованных госпредприятий. Власть должна принадлежать рабочим! Ликвидируем централизацию Нового курса и обеспечим равное распределение ресурсов."  
 AAW_USA_rural_development:0 "Развитие сельских территорий"
 AAW_USA_rural_development_desc:0 "Сельские районы Великих равнин десятилетиями не получали инвестиций. Возродим эти земли для американских фермеров!"
 AAW_USA_rural_development_tt:0 "Добавляет один уровень §Yинфраструктуры§! в §YОклахоме§!, §YКанзасе§!, §YНебраске§!, §YВайоминге§! и §YКолорадо§!"
 AAW_USA_workers_democracy:0 "Рабочая демократия"  
 AAW_USA_workers_democracy_desc:0 "Американская демократия основана на власти народа. Наше правительство расширит эти принципы, уделяя особое внимание рабочим, чьим трудом крепнет страна."
 AAW_USA_bureau_of_social_reform:0 "Бюро социальных реформ"
 AAW_USA_bureau_of_social_reform_desc:0 "Норман Томас верит не в перманентную революцию, а в перманентные социальные реформы. Создадим правительственный орган для этой цели."  
 AAW_USA_for_the_workers_by_the_workers:0 "Рабочими для рабочих"
 AAW_USA_for_the_workers_by_the_workers_desc:0 "«Правительство народа, народом и для народа» - наш девиз со времён основания. Адаптируем его для правительства, служащего американскому рабочему классу."
 AAW_USA_silver_shirt_legions:0 "Легионы Серебряных рубашек"  
 AAW_USA_silver_shirt_legions_desc:0 "Добровольческий корпус требует разрешения сформировать тыловые дивизии, чтобы высвободить фронтовые части. Это повысит эффективность гарнизонов."  
 AAW_USA_military_industrial_complex:0 "Военно-промышленный комплекс"  
 AAW_USA_military_industrial_complex_desc:0 "Частные предприятия стремятся расширить военную мощь. Поддержим их усилия для будущей территориальной экспансии."  
 AAW_USA_defense_institute_of_technology:0 "Оборонный технологический институт"  
 AAW_USA_defense_institute_of_technology_desc:0 "Научный потенциал Америки слаб со времён Великой войны. Для экспансии требуется срочно это исправить. Новый военный исследовательский центр решит проблему."
 AAW_USA_jets_focus:0 "Проект «Аэрокомет»"
 AAW_USA_jets_focus_desc:0 "Реактивные двигатели делают лучшие винтовые самолёты похожими на бумажные змеи. Новая эра воздушного боя принадлежит реактивной авиации. Инвестиции в эту сферу дадут нам превосходство."  
 AAW_USA_rocketry_focus:0 "Ракетостроение"  
 AAW_USA_rocketry_focus_desc:0 "Ракетные двигатели позволят нашим самолётам и снарядам летать дальше и быстрее. Исследуем эту перспективную технологию."  
 AAW_USA_intervention_mandates:0 "Мандаты на вмешательство"  
 AAW_USA_intervention_mandates_desc:0 "С ростом агрессии в мире мы должны быть готовы защищать демократию и суверенитет народов. Хотя требуется одобрение Конгресса, мы сможем его получить."
 AAW_USA_industrial_revitalization:0 "Возрождение промышленности"  
 AAW_USA_industrial_revitalization_desc:0 "Для эффективного вмешательства в войны сначала нужно восстановить нашу промышленность, всё ещё страдающую от Великой депрессии. Правильное финансирование вернёт её к максимальной эффективности."
 AAW_USA_spanish_civil_war_aid:0 "Беженцы гражданской войны в Испании"  
 AAW_USA_spanish_civil_war_aid_desc:0 "Демократия в Испании под угрозой. Политический хаос вызвал гуманитарный кризис. Приём беженцев поможет страдающим, а их рассказы укрепят поддержку военных действий, несмотря на недовольство изоляционистов." 
 AAW_USA_the_homefront:0 "Тыловой фронт"
 AAW_USA_the_homefront_desc:0 "Наши солдаты не смогут эффективно воевать, если будут беспокоиться о семьях. Гражданские, обеспечивающие фронт, нуждаются в высокой морали. Создание информационного отдела повысит производительность."
